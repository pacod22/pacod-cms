<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  The magazine's article widgets, one per article-list style, plus `cover`: the hero style when it
  stands in the home page's `top` region, full width.

  The rules of editorial's widgets hold here too:

    * PageComposer has sliced each slot to its section's count and offset; a fragment renders
      everything it is handed and queries nothing.
    * An article without an image is skipped by the widgets that show one -- getImageFilename()
      is "" then, and src="/assets/img/articles/" would be a request for nothing -- except
      `ranked`, which shows no pictures.

  metaLine and authors keep editorial's signatures: the pages this set inherits (search) call them.
*/-->

<!--/* The date, then the reads. Callers supply the wrapper. */-->
<th:block th:fragment="metaLine(item, lang)">
    <span th:text="${item.dateAsText}">01.01.2026</span>
    <span aria-hidden="true">·</span>
    <span class="mz-reads">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             aria-hidden="true" focusable="false">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span th:text="${item.counter != null ? item.counter : 0}">0</span>
    </span>
</th:block>

<!--/* A listing item's byline: names only, the job titles belong to the article page. */-->
<th:block th:fragment="authors(item)"><th:block th:if="${item.authorCount > 0}"
        th:text="#{magazine.byline(${item.authorNames()})}">By someone</th:block></th:block>

<!--/* The category an item belongs to, linked; nothing when it has none. */-->
<th:block th:fragment="kicker(item, lang)">
    <a class="mz-kicker" th:if="${item.kickerName() != null}"
       th:href="@{/list/{id}(id=${item.kickerId()}, lang=${lang})}" th:text="${item.kickerName()}">Section</a>
</th:block>

<!--/* ===================================================================================
       cover: the cover story, full width, its picture under the type. Only from the home page's
       `top` region (sections :: topRegion); a hero anywhere else is `hero` below.
       =================================================================================== */-->
<th:block th:fragment="cover(slot, lang)">
    <th:block th:with="item=${slot.first}">
        <article class="mz-cover" th:if="${item != null}"
                 th:classappend="${#strings.isEmpty(item.imageFilename)} ? 'mz-cover--plain' : ''">
            <div class="mz-cover__media" th:if="${!#strings.isEmpty(item.imageFilename)}">
                <img th:src="'/assets/img/articles/' + ${item.imageFilename}" th:alt="${item.imageAlt}"
                     fetchpriority="high"/>
            </div>
            <div class="shell mz-cover__text">
                <div class="mz-cover__label">
                    <span th:text="#{magazine.coverStory}">Cover story</span>
                    <th:block th:if="${item.kickerName() != null}">
                        <span aria-hidden="true">·</span>
                        <a th:href="@{/list/{id}(id=${item.kickerId()}, lang=${lang})}" th:text="${item.kickerName()}">Section</a>
                    </th:block>
                </div>
                <h1 class="mz-cover__title">
                    <a th:href="@{/article/{id}(id=${item.id}, lang=${lang})}" th:utext="${item.title}">Title</a>
                </h1>
                <p class="mz-cover__dek" th:if="${!#strings.isEmpty(item.description)}" th:utext="${item.description}">Dek</p>
                <p class="mz-cover__meta">
                    <span th:if="${item.authorCount > 0}"><th:block
                            th:replace="~{fragments/widgets :: authors(${item})}"></th:block></span>
                    <span th:text="${item.dateAsText}">01.01.2026</span>
                </p>
                <a class="mz-button mz-button--light" th:href="@{/article/{id}(id=${item.id}, lang=${lang})}"
                   th:text="#{magazine.readStory}">Read the story</a>
            </div>
        </article>
    </th:block>
</th:block>

<!--/* ===================================================================================
       hero: one article, large, inside a column: picture, then the type beside or under it.
       =================================================================================== */-->
<th:block th:fragment="hero(slot, lang)">
    <th:block th:with="item=${slot.first}">
        <article class="mz-feature" th:if="${item != null}">
            <div class="mz-feature__media" th:if="${!#strings.isEmpty(item.embedded)}">
                <div class="video-container" th:utext="${item.embedded}"></div>
            </div>
            <a class="mz-feature__media" th:if="${#strings.isEmpty(item.embedded) and !#strings.isEmpty(item.imageFilename)}"
               th:href="@{/article/{id}(id=${item.id}, lang=${lang})}">
                <img th:src="'/assets/img/articles/' + ${item.imageFilename}" th:alt="${item.imageAlt}" fetchpriority="high"/>
            </a>
            <div class="mz-feature__body">
                <th:block th:replace="~{fragments/widgets :: kicker(${item}, ${lang})}"></th:block>
                <h2 class="mz-feature__title">
                    <a th:href="@{/article/{id}(id=${item.id}, lang=${lang})}" th:utext="${item.title}">Title</a>
                </h2>
                <p class="mz-feature__dek" th:if="${!#strings.isEmpty(item.description)}" th:utext="${item.description}">Dek</p>
                <p class="mz-meta">
                    <span th:if="${item.authorCount > 0}"><th:block th:replace="~{fragments/widgets :: authors(${item})}"></th:block></span>
                    <th:block th:replace="~{fragments/widgets :: metaLine(${item}, ${lang})}"></th:block>
                </p>
            </div>
        </article>
    </th:block>
</th:block>

<!--/* ===================================================================================
       cards: the grid, an article list's default style. Four items or more make a mosaic -- the
       first one large, two beside it, the rest in rows.
       =================================================================================== */-->
<th:block th:fragment="cards(slot, lang, showHeading)">
    <div class="section-head" th:if="${showHeading and !#strings.isEmpty(slot.name)}">
        <h2 class="section-head__title" th:text="${slot.name}">Heading</h2>
        <a class="section-head__link" th:if="${slot.categoryId != null}"
           th:href="@{/list/{id}(id=${slot.categoryId}, lang=${lang})}"
           th:text="#{list.showAll}">All articles</a>
    </div>

    <div class="mz-grid" th:classappend="${slot.items.size() >= 4} ? 'mz-grid--mosaic' : ''">
        <article class="mz-card" th:each="item : ${slot.items}"
                 th:if="${!#strings.isEmpty(item.imageFilename)}">
            <a class="mz-card__media" th:href="@{/article/{id}(id=${item.id}, lang=${lang})}">
                <img th:src="'/assets/img/articles/' + ${item.imageFilename}" th:alt="${item.imageAlt}" loading="lazy"/>
            </a>
            <div class="mz-card__body">
                <th:block th:replace="~{fragments/widgets :: kicker(${item}, ${lang})}"></th:block>
                <h3 class="mz-card__title">
                    <a th:href="@{/article/{id}(id=${item.id}, lang=${lang})}" th:utext="${item.title}">Title</a>
                </h3>
                <p class="mz-card__dek" th:if="${!#strings.isEmpty(item.description)}" th:utext="${item.description}">Dek</p>
                <p class="mz-meta">
                    <span th:if="${item.authorCount > 0}"><th:block th:replace="~{fragments/widgets :: authors(${item})}"></th:block></span>
                    <span th:text="${item.dateAsText}">01.01.2026</span>
                </p>
            </div>
        </article>
    </div>
</th:block>

<!--/* ===================================================================================
       vertical: a narrow column of small pictures and titles (the `list` style). Its heading is
       always printed, so a layout gives it one.
       =================================================================================== */-->
<th:block th:fragment="vertical(slot, lang)">
    <div class="section-head">
        <h2 class="section-head__title" th:text="${slot.name}">Heading</h2>
    </div>
    <div class="mz-list">
        <article class="mz-list__item" th:each="item : ${slot.items}"
                 th:if="${!#strings.isEmpty(item.imageFilename)}">
            <a class="mz-list__media" th:href="@{/article/{id}(id=${item.id}, lang=${lang})}">
                <img th:src="'/assets/img/articles/' + ${item.imageFilename}" th:alt="${item.imageAlt}" loading="lazy"/>
            </a>
            <div class="mz-list__body">
                <th:block th:replace="~{fragments/widgets :: kicker(${item}, ${lang})}"></th:block>
                <h3 class="mz-list__title">
                    <a th:href="@{/article/{id}(id=${item.id}, lang=${lang})}" th:utext="${item.title}">Title</a>
                </h3>
                <span class="mz-meta" th:text="${item.dateAsText}">01.01.2026</span>
            </div>
        </article>
    </div>
    <a class="mz-button mz-button--ghost mz-button--block" th:if="${slot.categoryId != null}"
       th:href="@{/list/{id}(id=${slot.categoryId}, lang=${lang})}" th:text="#{list.showAll}">All articles</a>
</th:block>

<!--/* ===================================================================================
       ranked: most read, numbered; no pictures, so every item renders.
       =================================================================================== */-->
<th:block th:fragment="ranked(slot, lang)">
    <div class="section-head">
        <h2 class="section-head__title" th:text="${slot.name}">Most read</h2>
    </div>
    <ol class="mz-ranked">
        <li class="mz-ranked__item" th:each="item, i : ${slot.items}">
            <span class="mz-ranked__no" th:text="${i.count}">1</span>
            <span class="mz-ranked__body">
                <th:block th:replace="~{fragments/widgets :: kicker(${item}, ${lang})}"></th:block>
                <a class="mz-ranked__title" th:href="@{/article/{id}(id=${item.id}, lang=${lang})}"
                   th:utext="${item.title}">Title</a>
                <span class="mz-meta"><th:block th:replace="~{fragments/widgets :: metaLine(${item}, ${lang})}"></th:block></span>
            </span>
        </li>
    </ol>
</th:block>

<!--/* ===================================================================================
       videos: four across (the `video` style): the player where an article has one, else its
       picture.
       =================================================================================== */-->
<th:block th:fragment="videos(slot, lang)">
    <div class="mz-grid mz-grid--four">
        <article class="mz-card" th:each="item : ${slot.items}"
                 th:if="${!#strings.isEmpty(item.embedded) or !#strings.isEmpty(item.imageFilename)}">
            <div class="video-container" th:if="${!#strings.isEmpty(item.embedded)}" th:utext="${item.embedded}"></div>
            <a class="mz-card__media" th:if="${#strings.isEmpty(item.embedded)}"
               th:href="@{/article/{id}(id=${item.id}, lang=${lang})}">
                <img th:src="'/assets/img/articles/' + ${item.imageFilename}" th:alt="${item.imageAlt}" loading="lazy"/>
            </a>
            <div class="mz-card__body">
                <h3 class="mz-card__title mz-card__title--compact">
                    <a th:href="@{/article/{id}(id=${item.id}, lang=${lang})}" th:utext="${item.title}">Title</a>
                </h3>
                <p class="mz-meta" th:text="${item.dateAsText}">01.01.2026</p>
            </div>
        </article>
    </div>
</th:block>
</body>
</html>
