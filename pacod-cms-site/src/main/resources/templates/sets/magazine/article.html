<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang != null ? lang : #locale.language}">
<!--/*
  One article: GET /article/{id}. The headline and the lead picture across the page
  (fragments/article-view :: articleHead), then the body where the layout's primary section stands,
  beside the aside, then the `wide` region under both. index.html (/latest) is the same page.
*/-->
<head th:replace="~{fragments/head :: head(
        lang=${lang},
        pageTitle=${article.title},
        pageDesc=${article.description},
        ogUrl=${site.url('/article/' + article.id + '?lang=' + lang)},
        ogImagePath=${article.image},
        ogImageType=${article.content})}"></head>

<body class="mz-page mz-page--article">
<th:block th:replace="~{fragments/scripts :: gtmNoscript}"></th:block>
<th:block th:replace="~{fragments/scripts :: facebookSdk(${lang})}"></th:block>
<th:block th:replace="~{fragments/navbar :: navbar(${lang})}"></th:block>

<div class="shell">
    <th:block th:replace="~{fragments/ad-sidebar :: topBanners(${topBanners})}"></th:block>
</div>

<th:block th:replace="~{fragments/article-view :: articleHead(${article}, ${lang})}"></th:block>

<div class="shell layout mz-layout">
    <main class="layout__main">
        <th:block th:each="s : ${regions.get('main')}">
            <th:block th:if="${s.primary}">
                <th:block th:replace="~{fragments/article-view :: articleView(${article}, ${lang})}"></th:block>
            </th:block>
            <th:block th:unless="${s.primary}">
                <th:block th:replace="~{sections :: ${s.fragment}(s=${s}, lang=${lang})}"></th:block>
            </th:block>
        </th:block>
    </main>

    <aside class="layout__aside">
        <th:block th:replace="~{fragments/ad-sidebar :: adSidebar(${sidebarBanners})}"></th:block>
        <th:block th:replace="~{sections :: region(${regions.get('aside')}, ${lang})}"></th:block>
    </aside>
</div>

<div class="mz-wide" th:unless="${regions.isEmpty('wide')}">
    <div class="shell">
        <th:block th:replace="~{sections :: region(${regions.get('wide')}, ${lang})}"></th:block>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer(${lang})}"></th:block>
<th:block th:replace="~{fragments/scripts :: codeHighlight(${article.text})}"></th:block>
<th:block th:replace="~{fragments/scripts :: siteScripts}"></th:block>
</body>
</html>
