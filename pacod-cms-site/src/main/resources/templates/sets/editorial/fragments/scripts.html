<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  The end-of-body scripts, shared by all public templates.

  What is NOT here matters as much as what is:

    * No jQuery, no component framework, no icon font. site.js is the site's own script for
      readers -- the theme toggle, the mobile nav, the gallery and the bookings' beacons --
      and preview.js loads only in the studio's draft preview (fragments/head :: preview).
    * No script that re-fetches the landing widgets over AJAX from /web/v1/bycategory/{id}:
      it would overwrite the server-rendered markup, including blanking widgets whose articles
      have no image. Every page is rendered on the server, and must stay that way.
    * No translation script: the chrome is translated on the server, from messages*.properties.
*/-->

<!--/* Google Tag Manager (noscript), only for a website that has configured a container. */-->
<th:block th:fragment="gtmNoscript">
    <noscript th:if="${site != null and site.gtmId() != null}">
        <iframe th:src="@{https://www.googletagmanager.com/ns.html(id=${site.gtmId()})}" title="Google Tag Manager"
                height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
</th:block>

<!--/* The Facebook SDK, needed by the share and like buttons on the article pages, and only
       for a website with a Facebook application id. The locale is part of the script URL, so it
       is rebuilt per language. */-->
<th:block th:fragment="facebookSdk(lang)">
    <th:block th:if="${site != null and site.facebookAppId() != null}">
        <div id="fb-root"></div>
        <script th:inline="javascript">
            window.fbAsyncInit = function () {
                FB.init({ appId: /*[[${site.facebookAppId()}]]*/ '0', xfbml: true, version: 'v24.0' });
            };
        </script>
        <script async defer crossorigin="anonymous"
                th:src="${'https://connect.facebook.net/' + site.ogLocale(lang) + '/sdk.js#xfbml=1&version=v24.0'}">
        </script>
    </th:block>
</th:block>

<th:block th:fragment="siteScripts">
    <script defer src="/site-assets/site.js"></script>
</th:block>
</body>
</html>
