<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* The set's own stylesheets, linked by fragments/head before the website's theme. A set that
       extends this one replaces this file, not the head. From the jar (WebSiteAssetsConfiguration),
       never from a website's files. */-->
<th:block th:fragment="stylesheets">
    <link rel="stylesheet" href="/site-assets/site.css"/>
</th:block>
</body>
</html>
