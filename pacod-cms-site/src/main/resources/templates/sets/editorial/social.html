<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${social.htmlLang}"
      th:with="profileName=${social.name ?: site.name(social.htmlLang)},
               shareImage=${social.ogImagePath ?: site.ogImage()}">
<!--/*
  /social -- the link-in-bio page. SocialController renders it; everything below is resolved in
  SocialView, so no expression here picks a language, builds a URL or reads a schedule.

  ITS OWN <head>, NOT fragments/head: this page is the one opened from inside the social apps'
  in-app browsers, so it carries the least it can -- no site.js, no stylesheet beyond the
  site's, no script it does not need. The theme snippet and GTM are included from fragments/head
  by name, so the container id still exists once. Nothing on it may reload or redirect the page:
  a second request would count the visit twice, and carry THIS page as its Referer, so a visit
  from Instagram would be recorded as one from the site.

  NO AD COLUMNS. SocialController never calls BannerService.forPage; a booking with an empty page
  list runs everywhere, and nobody bought a bio page.

  EVERY HREF THAT LEAVES THROUGH A TILE CARRIES src=. The network a visit came from is decided
  when this page renders; the click that follows has this page as its Referer and cannot be
  classified on its own. PublicTemplateRenderTest pins it, because the server cannot see an href
  that lost it. rel="nofollow" is there so crawlers do not walk the redirects and count as clicks.

  CLASS NAMES start with linkpage, never social-, share-, follow- or ad-. Fanboy's Social list
  hides generic .bio-social and friends, and a reader running it would see an empty page; the
  names were checked against EasyList, EasyPrivacy and both Fanboy lists before they were chosen.

  The icons are an inline sprite, one <symbol id="si-…"> per SocialIcon constant -- no request, and
  currentColor carries both themes. Brand glyphs are Simple Icons 15.0.0 paths (CC0 1.0,
  https://simpleicons.org); Simple Icons no longer ships LinkedIn, so that one and the generic
  icons are drawn here. PublicTemplateRenderTest checks every constant has its symbol.
*/-->
<head>
    <script th:replace="~{fragments/head :: theme}"></script>
    <script th:replace="~{fragments/head :: gtm}"></script>
    <th:block th:replace="~{fragments/head :: preview}"></th:block>

    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title th:text="${profileName}">Profile</title>
    <meta name="description" th:content="${social.bio != null ? social.bio : profileName}"/>
    <meta name="author" th:content="${site.name(social.htmlLang)}"/>

    <meta property="og:url" th:content="${site.url('/social')}"/>
    <meta property="og:type" content="profile"/>
    <meta property="og:site_name" th:content="${site.name(social.htmlLang)}"/>
    <meta property="og:title" th:content="${profileName}"/>
    <meta property="og:description" th:content="${social.bio != null ? social.bio : profileName}"/>
    <meta property="og:image" th:if="${shareImage != null}"
          th:content="${site.url(#uris.escapePath(shareImage))}"/>
    <meta property="fb:app_id" th:if="${site.facebookAppId() != null}" th:content="${site.facebookAppId()}"/>

    <link rel="icon" type="image/svg+xml" th:href="${site.favicon() ?: '/site-assets/favicon.svg'}"
          href="/site-assets/favicon.svg"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"/>
    <link rel="stylesheet" href="/site-assets/site.css"/>
    <!--/* The website's theme, as on every page (fragments/head). */-->
    <link rel="stylesheet" th:if="${theme != null and theme.present}" th:href="${theme.href()}"/>
</head>

<body class="linkpage-body">
<th:block th:replace="~{fragments/scripts :: gtmNoscript}"></th:block>

        <symbol id="si-podcast" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></g></symbol>
        <symbol id="si-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></g></symbol>
        <symbol id="si-chevron" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></g></symbol>
    </defs>
</svg>

<main class="linkpage">

    <header class="linkpage__profile">
        <img class="linkpage__avatar" th:if="${social.avatarPath != null}" th:src="${social.avatarPath}"
             src="" alt="" width="104" height="104"/>
        <a class="linkpage__brand" th:unless="${social.avatarPath != null}" href="/"
           th:title="${site.name(social.htmlLang)}">
            <th:block th:if="${site.logoLight() != null}">
                <img class="linkpage__brand-light" th:src="${site.logoLight()}" th:alt="${site.name(social.htmlLang)}"/>
                <img class="linkpage__brand-dark" th:src="${site.logoDark()}" alt="" aria-hidden="true"/>
            </th:block>
        </a>

        <h1 class="linkpage__name" th:text="${profileName}" th:lang="${social.nameLang}">Profile</h1>
        <p class="linkpage__bio" th:if="${social.bio != null}" th:text="${social.bio}"
           th:lang="${social.bioLang}"></p>

        <nav class="linkpage__icons" th:unless="${social.icons.isEmpty()}"
             th:aria-label="#{social.networks}">
            <a class="linkpage__icon" th:each="tile : ${social.icons}" th:href="${tile.href}" rel="nofollow"
               th:title="${tile.label}" th:aria-label="${tile.label}" th:lang="${tile.labelLang}">
                <svg aria-hidden="true" focusable="false"><use th:href="${'#' + (tile.symbol != null ? tile.symbol : 'si-web')}"></use></svg>
            </a>
        </nav>
    </header>

    <nav class="linkpage__links" th:unless="${social.buttons.isEmpty()}"
         th:aria-label="#{social.links}">
        <!--/* A link to one of the website's articles carries the article's cover in place of its
               icon -- the image the site uses as that article's share card, read with the page in
               SocialPageReader. Decorative (alt=""): the text beside it says what it is. */-->
        <a class="linkpage__link" th:each="tile : ${social.buttons}" th:href="${tile.href}" rel="nofollow"
           th:classappend="${tile.thumbPath != null} ? 'linkpage__link--thumb'">
            <img class="linkpage__link-thumb" th:if="${tile.thumbPath != null}" th:src="${tile.thumbPath}"
                 src="" alt="" width="96" height="64" decoding="async"/>
            <svg class="linkpage__link-icon" th:if="${tile.thumbPath == null and tile.symbol != null}" aria-hidden="true" focusable="false"><use th:href="${'#' + tile.symbol}"></use></svg>
            <span class="linkpage__link-text" th:text="${tile.label}" th:lang="${tile.labelLang}">Link</span>
            <svg class="linkpage__link-arrow" aria-hidden="true" focusable="false"><use href="#si-chevron"></use></svg>
        </a>
    </nav>

    <section class="linkpage__section" th:unless="${social.articles.isEmpty()}">
        <h2 class="linkpage__heading" th:text="${social.latestHeading ?: #messages.msg('social.latest')}"
            th:lang="${social.latestHeadingLang}">Latest articles</h2>
        <a class="linkpage__article" th:each="article : ${social.articles}" th:href="${article.href}" rel="nofollow">
            <img class="linkpage__thumb" th:if="${article.imagePath != null}" th:src="${article.imagePath}"
                 src="" alt="" width="96" height="64" loading="lazy" decoding="async"/>
            <span class="linkpage__thumb linkpage__thumb--empty" th:unless="${article.imagePath != null}"
                  aria-hidden="true"><svg><use href="#si-article"></use></svg></span>
            <span class="linkpage__article-title" th:text="${article.title}" th:lang="${article.titleLang}">Title</span>
        </a>
    </section>

    <nav class="linkpage__langs" th:if="${social.hasLanguageChoice()}" th:aria-label="#{social.language}">
        <a class="linkpage__lang" th:each="choice : ${social.languages}" th:href="${choice.href}" rel="nofollow"
           th:text="${choice.name}" th:lang="${choice.code}"
           th:attr="aria-current=${choice.current ? 'page' : null}">English</a>
    </nav>

    <footer class="linkpage__foot">
        <a href="/" th:text="${site.ownHosts().isEmpty() ? site.name(social.htmlLang) : site.ownHosts().iterator().next()}">Website</a>
    </footer>
</main>
</body>
</html>
