<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  The minimal set's sections -- the types design/sets/minimal.yaml names: article lists, rich text,
  calls to action (and the page's own content, which each page template renders itself). A search
  box or social links in a layout never reach this file on this set: LayoutResolver leaves them
  out and the studio flags them.

  Article lists are lists here, whatever their style, except the lead story ('hero'), which keeps
  editorial's widget. Fragments only read what PageComposer looked up (s.data).
*/-->

<th:block th:fragment="region(sections, lang)">
    <th:block th:each="s : ${sections}">
        <th:block th:unless="${s.primary}">
            <th:block th:replace="~{sections :: ${s.fragment}(s=${s}, lang=${lang})}"></th:block>
        </th:block>
    </th:block>
</th:block>

<th:block th:fragment="articleList(s, lang)">
    <section class="section section--list" th:if="${!s.data.isEmpty()}">
        <th:block th:if="${s.setting('style') == 'hero'}">
            <th:block th:replace="~{fragments/widgets :: hero(${s.data}, ${lang})}"></th:block>
        </th:block>
        <th:block th:unless="${s.setting('style') == 'hero'}">
            <div class="section-head" th:if="${!#strings.isEmpty(s.data.name)}">
                <h2 class="section-head__title" th:text="${s.data.name}">Heading</h2>
                <a class="section-head__link" th:if="${s.data.categoryId != null}"
                   th:href="@{/list/{id}(id=${s.data.categoryId}, lang=${lang})}"
                   th:text="#{list.showAll}">All articles</a>
            </div>
            <ol class="plain-list" th:classappend="${s.setting('style') == 'ranked'} ? 'plain-list--ranked'">
                <li class="plain-list__item" th:each="item : ${s.data.items}">
                    <a class="plain-list__title" th:href="@{/article/{id}(id=${item.id}, lang=${lang})}"
                       th:utext="${item.title}">Title</a>
                    <p class="plain-list__text" th:if="${!#strings.isEmpty(item.description)}"
                       th:text="${item.description}">Description</p>
                    <span class="plain-list__meta">
                        <th:block th:replace="~{fragments/widgets :: metaLine(${item}, ${lang})}"></th:block>
                    </span>
                </li>
            </ol>
        </th:block>
    </section>
</th:block>

<th:block th:fragment="richText(s, lang)">
    <section class="section section--text">
        <div class="section-head" th:if="${s.setting('heading') != null}">
            <h2 class="section-head__title" th:text="${s.setting('heading')}">Heading</h2>
        </div>
        <div class="article-body" th:utext="${s.setting('html')}">Text</div>
    </section>
</th:block>

<th:block th:fragment="callToAction(s, lang)">
    <section class="section callout">
        <h2 class="callout__title" th:text="${s.setting('heading')}">Heading</h2>
        <p class="callout__text" th:if="${s.setting('text') != null}" th:text="${s.setting('text')}">Text</p>
        <a class="callout__button" th:href="${s.setting('url')}" th:text="${s.setting('label')}">Label</a>
    </section>
</th:block>

</body>
</html>
