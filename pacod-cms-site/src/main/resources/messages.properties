# The public site's chrome: every word a page shows that is not content.
#
# English is the base; messages_<code>.properties translate it. A language with no bundle of its
# own renders the chrome in English while its content follows LanguageChain -- the bundles and the
# `language` collection are independent, and a language added in the studio does not need one.
#
# Rules, all enforced by MessageBundleTest:
#   * every key here exists in every translation, and every #{key} a template uses exists here;
#   * a value that takes arguments ({0}) goes through MessageFormat, so an apostrophe in it must be
#     doubled (''); a value without arguments is used verbatim and must not double them.

