# ----------------------------------------
# WEB PROPERTIES
# ----------------------------------------

# EMBEDDED SERVER CONFIGURATION (ServerProperties)
# Server port
server.port=8443

server.servlet.context-path=/
server.http2.enabled=true

# Errors render as the website's template set's error page (TemplateSetConfig). Boot's whitelabel
# page would win otherwise: it looks for templates/error.html at the classpath root, and there is
# none there -- every set has its own.
spring.web.error.whitelabel.enabled=false

# active profile
spring.profiles.active=prod

# Logging: the pacod convention (pacod-demo/docs/LOGGING.md), carried out by logback-spring.xml.
# stdout gets one event per line, JSON or text; a JSON file goes under app.log.dir as
# <service>.log, rotated at midnight UTC and at 20MB, kept 30 days and 600MB in all. Boot's
# logging.file.* and logging.pattern.* do nothing beside a logback-spring.xml, so there are none.
# Spring Boot's banner would be lines on stdout that are no event.
spring.main.banner-mode=off
# The compose service name: the event's "service" and the file's name. Not the other application's:
# /data/logs is one volume shared by every container, so two applications writing the same filename
# would interleave into one file and roll each other over.
app.log.service=${SERVICE_NAME:cms-site}
# json or text, any case (anything else: json). The file is JSON whatever this says.
app.log.format=${APP_LOG_FORMAT:json}
# debug, info, warn (or warning), error, any case (anything else: info). The root level; set no
# logging.level.root here, Boot would apply it over this one.
app.log.level=${APP_LOG_LEVEL:info}
# Log files go to an explicit, env-overridable directory. A `~` in a path is not expanded -- it
# names a literal directory called "~".
app.log.dir=${LOG_DIR:/data/logs}

# Logging levels of a few libraries, applied by Boot over logback-spring.xml (which turns
# org.springframework down to WARN).
logging.level.org.springframework.web=INFO
logging.level.org.apache.http=INFO
logging.level.org.apache.tomcat=INFO
logging.level.org.springframework.security=INFO

# MongoDB
# Note the two distinct prefixes in Spring Boot 4: spring.mongodb.* configures the
# driver connection, spring.data.mongodb.* configures Spring Data behaviour.
#
# Index creation is deliberately NOT left to Spring Data. Its creator runs during context
# refresh and lets any failure abort startup, so a single unbuildable index (e.g. a unique
# index over data that already contains duplicates) takes the application down. SiteIndexes creates
# the same indexes when the studio provisions a website, one database at a time, and logs failures
# instead. Do not set this back to true: Spring Data's creator knows nothing of per-website databases.
spring.data.mongodb.auto-index-creation=false

# File upload
#
# Nothing here uploads. Both upload paths -- article images and banner creatives -- are the
# studio's, and so are spring.servlet.multipart.*, with the comment explaining why those limits
# are pinned to Caddy's request_body max_size. This application has no MultipartFile handler at
# all; multipart limits here would look like a limit that was being enforced.

# Banner impressions are buffered in memory and flushed as one bulk write per interval; see
# BannerImpressionCounter for why they are not one $inc per render.
app.banner.impression-flush.ms=60000
app.banner.impression-counting.enabled=true

# Site traffic for the studio's monitoring screen. Buffered and flushed exactly like the banner
# impressions above, and for the same reason -- see SiteMetricCollector.
#
# This is the ONLY historical data the platform keeps. Article.counter, Banner.impressions and
# Banner.clicks are all-time scalars with no date on them, so nothing here can be back-filled:
# the series starts when this is first switched on.
app.metrics.enabled=true
app.metrics.flush.ms=60000
# Salts the opaque reader key derived from address + User-Agent. Blank means an ephemeral salt
# generated at startup, which is safe but does not survive a restart -- see VisitorIdentity, and
# set METRICS_VISITOR_SALT to make reader identity stable across deploys.
app.metrics.visitor-salt=${METRICS_VISITOR_SALT:}

# Crawlers and other automated clients, for the studio's crawler screen -- see CrawlerTrafficFilter.
# tracking.enabled gates only the recording (bucket counts and the crawlerVisit log): the filter
# still classifies every request and keeps automated ones out of views, readers, banner numbers and
# Article.counter either way. verify.enabled switches the reverse/forward DNS check; off, every hit
# is UNKNOWN (not checked).
app.crawlers.tracking.enabled=${CRAWLER_TRACKING:true}
app.crawlers.verify.enabled=${CRAWLER_VERIFY:true}
app.crawlers.flush.ms=10000

# The studio's origin (scheme://host[:port]): the one other page allowed to frame this site's
# answers -- a banner layout's folder and a draft preview (FramingHeaders). Blank: only a
# website frames itself. Compose passes STUDIO_ORIGIN, the address the studio signs in at.
pacod.studio.origin=${STUDIO_ORIGIN:}

# Draft previews (PreviewTokens): the key the studio signs a preview's address with and the site
# checks it against -- the same value on both. Blank switches previews off; there is no default
# worth publishing, and a key made up at each start could never match the other application's.
# make init writes one into .env, never printed.
pacod.preview.secret=${PACOD_PREVIEW_SECRET:}
