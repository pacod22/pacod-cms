# pacod-cms standalone: its own copies of the shared components cms needs, under their shared
# names (pacod-demo/docs/NETWORK.md) -- the front door (pacod-caddy), sign-in (pacod-id, its
# pacod-postgres and pacod-db-init), the development gateway (pacod-gw and gw-mock, profile
# dev-gateway) and the mail catcher (pacod-mailpit, profile mailpit). Loaded together with
# docker-compose.yml by `make up`; the full stack does not load this file, it runs one of each
# shared component for every product and reuses these definitions through "extends".
#
# Only one of each pacod-* component runs on a host at a time: stop another repo's standalone stack
# (or the full stack) before `make up` here.

# Every service's container log rotates (pacod-demo/docs/LOGGING.md, section 2): 10 MB a file, five
# files. YAML anchors do not cross files, so each compose file declares its own copy.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---- AI: the development gateway (profile dev-gateway) ---------------------------------------
  #
  # pacod-gw-lite in front of pacod-gw's mock providers: a chat answer is an echo of the last user
  # message, a JSON-schema answer an instance of the schema, and nothing leaves the machine. The
  # studio reaches it at http://pacod-gw:8080 with the key make init wrote (PACOD_GW_API_KEY). A
  # deployment sets COMPOSE_PROFILES= and points PACOD_GW_URL and PACOD_GW_API_KEY at a real
  # gateway. Images: make images, from PACOD_GW_SRC.
  pacod-gw:
    image: ${PACOD_GW_LITE_IMAGE:-pacod-gw-lite:dev}
    container_name: pacod-gw
    logging: *logging
    profiles: [dev-gateway]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["serve"]
    environment:
      PGW_LISTEN: 0.0.0.0:8080
      PGW_LOG_FORMAT: ${PGW_LOG_FORMAT:-text}
      PGW_EGRESS_ALLOW_PRIVATE: gw-mock
      PGW_PROVIDER_OPENAI_KEY: dev-openai-key
      PGW_PROVIDER_OPENAI_BASE_URL: http://gw-mock:9000/v1
      PGW_PROVIDER_ANTHROPIC_KEY: dev-anthropic-key
      PGW_PROVIDER_ANTHROPIC_BASE_URL: http://gw-mock:9000
      PGW_MODEL_GPT: openai/gpt-dev
      PGW_MODEL_GPT_PRICE: input=1.25,output=10
      PGW_MODEL_CLAUDE: anthropic/claude-dev
      PGW_MODEL_CLAUDE_PRICE: input=3,output=15
      PGW_POOL_FAST: openai/gpt-dev,anthropic/claude-dev
      # The studio's key: generated into .env by make init, the same on both sides.
      PGW_CLIENT_CMS_KEY: ${PACOD_GW_API_KEY:-}
    depends_on:
      gw-mock:
        condition: service_healthy
    networks:
      - pacod-net

  gw-mock:
    image: ${PACOD_GW_MOCK_IMAGE:-pacod-gw-mock:dev}
    container_name: gw-mock
    logging: *logging
    profiles: [dev-gateway]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - pacod-net

  # ---- sign-in: pacod-id, its PostgreSQL, and a mail catcher --------------------------------
  #
  # pacod-id owns accounts, sessions and role bindings; the studio signs people in through it
  # (OIDC) and reads their roles from its feed. Its secrets have no defaults here -- a published
  # fallback would be a published key -- and `make init` generates them once into .env.
  # Readers of the websites never touch any of this.
  pacod-postgres:
    image: postgres:18.6-alpine3.24
    container_name: pacod-postgres
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PID_PG_SUPERUSER_PASSWORD:?run make init}
    volumes:
      - pacod-postgres-data:/var/lib/postgresql
    networks:
      - pacod-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # pacod-id's role and database on pacod-postgres, at every start (idempotent): every
  # platform/postgres/*-db.sh it finds in /initdb.d, in name order. Here: pacod-id's (id-db.sh,
  # the same file pacod-id ships), which also sets the role's password to PID_DB_PASSWORD.
  pacod-db-init:
    image: postgres:18.6-alpine3.24
    container_name: pacod-db-init
    logging: *logging
    depends_on:
      pacod-postgres:
        condition: service_healthy
    environment:
      PGHOST: pacod-postgres
      PGUSER: postgres
      PGPASSWORD: ${PID_PG_SUPERUSER_PASSWORD:?run make init}
      PID_DB_PASSWORD: ${PID_DB_PASSWORD:?run make init}
    volumes:
      - ./platform/postgres:/initdb.d:ro
    entrypoint: ["sh", "-c", "set -e; for f in /initdb.d/*.sh; do sh \"$$f\"; done"]
    networks:
      - pacod-net
    restart: "no"

  pacod-id:
    # Built from pacod-id's own sources by `make images` (only when the image is missing): a Rust
    # build, slow the first time. PACOD_ID_SRC names the checkout, ../pacod-id by default.
    image: ${PACOD_ID_IMAGE:-pacod-id:dev}
    container_name: pacod-id
    logging: *logging
    restart: unless-stopped
    depends_on:
      pacod-db-init:
        condition: service_completed_successfully
      # Only where it runs (profile mailpit: dev and stage); pacod-id connects only to send.
      pacod-mailpit:
        condition: service_started
        required: false
    environment:
      PID_DATABASE_URL: postgres://pacod_id:${PID_DB_PASSWORD:?run make init}@pacod-postgres:5432/pacod_id
      PID_KEK: ${PID_KEK:?run make init}
      PID_TOKEN_PEPPER: ${PID_TOKEN_PEPPER:?run make init}
      CMS_ID_STUDIO_SECRET: ${CMS_ID_STUDIO_SECRET:?run make init}
      CMS_ID_SERVICE_SECRET: ${CMS_ID_SERVICE_SECRET:?run make init}
      # The issuer is the address browsers use, and pacod-id answers its sign-in pages only on that
      # exact host and port. Development: Caddy's id host.
      CMS_ID_ISSUER: ${ID_ISSUER:-http://id.localhost:${HTTP_PORT:-8000}}
      CMS_STUDIO_ORIGIN: ${STUDIO_ORIGIN:-http://studio.localhost:${HTTP_PORT:-8000}}
      # Caddy forwards every sign-in; without this pacod-id sees Caddy's address for everyone and
      # its sign-in throttle would be shared by all of them.
      PID_TRUSTED_PROXIES: private_ranges
      # The first account, created once: a platform admin of the studio.
      PID_BOOTSTRAP_ADMIN_EMAIL: ${ID_ADMIN_EMAIL:-admin@pacod-cms.test}
      PID_BOOTSTRAP_ADMIN_PASSWORD: ${ID_ADMIN_PASSWORD:?run make init}
      PID_BOOTSTRAP_ADMIN_REALM: cms
      PID_BOOTSTRAP_ADMIN_ROLES: id.admin,cms.platform_admin
      # Mail: pacod-mailpit unless PID_SMTP_HOST names a relay (production must). TLS is starttls,
      # tls or none. The account's name and password are passed only when set.
      PID_SMTP_HOST: ${PID_SMTP_HOST:-pacod-mailpit}
      PID_SMTP_PORT: ${PID_SMTP_PORT:-1025}
      PID_SMTP_TLS: ${PID_SMTP_TLS:-none}
      PID_SMTP_USERNAME:
      PID_SMTP_PASSWORD:
      PID_EMAIL_FROM_ADDRESS: ${ID_MAIL_FROM:-id@pacod-cms.test}
      PID_EMAIL_FROM_NAME: pacod-cms
      PID_LOG_FORMAT: ${PID_LOG_FORMAT:-text}
      # Its address on pacod-admin-net alone: on 0.0.0.0 all of pacod-net would reach it.
      PID_INTERNAL_LISTEN: pacod-id-internal:8071
    volumes:
      - ./docker/pacod-id/pacod-id.toml:/etc/pacod-id/pacod-id.toml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    # The studio calls the internal listener at its alias on pacod-admin-net.
    networks:
      pacod-net:
      pacod-admin-net:
        aliases: [pacod-id-internal]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9170/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Every mail pacod-id sends (address confirmations, invitations, resets) ends here; none leaves
  # the machine. Its page: http://localhost:${MAILPIT_PORT:-8125}/ (on a stage server, through an
  # SSH tunnel). Profile mailpit: dev and stage; production sends through PID_SMTP_HOST.
  pacod-mailpit:
    image: axllent/mailpit:v1.27
    container_name: pacod-mailpit
    logging: *logging
    profiles: [mailpit]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8125}:8025"
    networks:
      - pacod-net

  # The front door, for every host: the studio's (STUDIO_HOST), pacod-id's (ID_HOST) and every
  # website's. cms's rules are platform/caddy/cms.caddy, mounted with every other fragment in
  # /etc/caddy/sites/; CADDYFILE picks the global options, pacod-id's site and the certificates
  # around them -- docker/caddy/Caddyfile (the default: production, HTTPS for every host, a
  # website's certificate obtained on demand once the site confirms the host is an active
  # website's) or docker/caddy/Caddyfile.dev (a developer machine: plain HTTP on HTTP_PORT, HTTPS
  # from Caddy's local CA on HTTPS_PORT), which env/dev.env names.
  pacod-caddy:
    image: caddy:2.11.6-alpine
    container_name: pacod-caddy
    logging: *logging
    restart: unless-stopped
    environment:
      ID_HOST: ${ID_HOST:-id.localhost}
      # The addresses of cms's two sites (platform/caddy/cms.caddy). The Makefile derives them
      # from STUDIO_HOST and PUBLIC_SCHEME: http:// and https:// on a developer machine, https://
      # alone (HTTP redirected to it) on stage and prod. Never blank: Caddy would not fall back to
      # the fragment's default for an empty value.
      CMS_STUDIO_SITE: ${CMS_STUDIO_SITE:-http://${STUDIO_HOST:-studio.localhost}, https://${STUDIO_HOST:-studio.localhost}}
      CMS_PUBLIC_SITE: ${CMS_PUBLIC_SITE:-http://, https://}
      # Both Caddyfiles here ask the site before an on-demand certificate (on_demand_tls), so the
      # websites' catch-all takes its certificates on demand. The full stack, HTTP only, leaves
      # this unset.
      CMS_PUBLIC_TLS: import cms-on-demand-tls
      # One extra line for Caddy's global options: `email ops@example.com`, or `local_certs` to try
      # the production Caddyfile without a public CA.
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      # The access log's format (platform/caddy/cms.caddy): json or console. Never blank: an empty
      # value is used as such, and Caddy has no log encoder by that name.
      CMS_CADDY_LOG_FORMAT: ${CMS_CADDY_LOG_FORMAT:-json}
      # A certificate pair of the deployment's own: naming SSL_CERT_FILE is the whole switch. The
      # Caddyfile then imports supplied-pair.caddy, which serves the pair for every name it covers;
      # otherwise this is empty and Caddy obtains every certificate itself.
      CADDY_SUPPLIED_PAIR: ${SSL_CERT_FILE:+import supplied-pair.caddy}
    depends_on:
      cms-site:
        condition: service_healthy
      cms-studio:
        condition: service_healthy
      # Started, not healthy: a pacod-id that is down must cost sign-in, not the websites.
      pacod-id:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8000}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ${CADDYFILE:-./docker/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/supplied-pair.caddy:/etc/caddy/supplied-pair.caddy:ro
      # The fragments: cms's site blocks (the full stack mounts every repo's here).
      - ./platform/caddy:/etc/caddy/sites:ro
      # The supplied pair, file by file, so certbot's symlinks in live/<domain>/ resolve on the
      # host. Unset, a placeholder stands in -- a bind mount needs a source -- and is never read.
      - ${SSL_CERT_FILE:-./docker/caddy/no-certificate}:/etc/caddy/tls/fullchain.pem:ro
      - ${SSL_KEY_FILE:-./docker/caddy/no-certificate}:/etc/caddy/tls/privkey.pem:ro
      # The certificates, Caddy's local CA and the account with the CA. Keep it: a CA rate-limits
      # re-issuing.
      - pacod-caddy-data:/data
      - pacod-caddy-config:/config
    networks:
      - pacod-net
    healthcheck:
      # Caddy's admin API, inside the container only. Not a site address: in production every one
      # of those redirects to HTTPS or needs a certificate. 127.0.0.1: busybox wget tries ::1 first.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  pacod-net:
    external: true
  pacod-admin-net:
    external: true

volumes:
  # pacod-id's PostgreSQL: accounts, sessions, role bindings. `make destroy` drops it.
  pacod-postgres-data:
  # Caddy's certificates, its local CA and its account with the CA.
  pacod-caddy-data:
  pacod-caddy-config:
