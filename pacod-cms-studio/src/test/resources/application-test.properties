# Test profile: enough configuration for the context to wire up, with no external services.
#
# No MongoDB server is needed. The driver connects lazily, so the context starts fine; the
# short server-selection timeout means any accidental query fails fast instead of hanging the
# build for the 30s default.
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=pacod_cms-test
spring.mongodb.username=
spring.mongodb.password=
spring.mongodb.uri=mongodb://localhost:27017/pacod-cms-test?serverSelectionTimeoutMS=500

# Index creation would connect eagerly at startup; Spring Data's creator stays off, as in every
# profile.
spring.data.mongodb.auto-index-creation=false

# TLS and the packaged keystore are irrelevant to a MOCK web environment.
server.ssl.enabled=false

# The console's screen-render tests DO render templates, so the resolver must actually find them.
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

app.log.dir=target/test-logs

# Application properties consumed via @Value; these must be present or the context fails.
app.image.folder=target/test-images
app.banner.folder=target/test-banners
app.article.defaultTitle=
app.article.defaultText=
app.article.defaultDescription=

# No background work in the tests: a runner would claim from whatever database the test points at.
pacod.jobs.runner.enabled=false

# The image rules, pinned to the shipped defaults. application.properties reads each from the
# environment (IMAGE_DIMENSION_CHECK and the rest), and the Makefile's bare `export` pushes every
# .env variable into every recipe -- so `make verify` against a deployment .env carrying
# IMAGE_DIMENSION_CHECK=false would run the whole suite with the check off, and the assertions
# about the default hint would fail while `./mvnw test` from a clean shell passes. A profile
# property outranks the placeholder's environment lookup; the DimensionCheckOff / FileSizeCheckOff
# nested classes still override these through @TestPropertySource, which outranks the profile.
app.image.required-width=600
app.image.required-height=400
app.image.max-bytes=131072
app.image.dimension-check.enabled=true
app.image.file-size-check.enabled=true

# The studio renders in Bulgarian under the tests, on purpose: the default (English) is also the base
# bundle, so with an English default a key missing from a translation could not be told from one
# that resolved. MgmtScreenRenderTest re-renders every screen in English as well.
pacod.studio.default-language=bg

# Every website's files, under sites/<id>/ (SiteStorage).
pacod.storage.root=target/test-storage

# No platform bootstrap: no control-plane indexes, no reconcile, no demo website.
pacod.bootstrap.enabled=false

# Sign-in is pacod-id's; nothing in the tests reaches it. The client registration still has to be
# buildable, and the feed, catalogue and scope sync stay off (they would try to connect).
pacod.id.enabled=false
pacod.id.issuer=http://id.test
pacod.id.internal-url=http://id-internal.test
pacod.id.studio-secret=test-studio-secret-0123456789abcdef0123
pacod.id.service-secret=test-service-secret-0123456789abcdef012
pacod.id.studio-origin=http://studio.test
