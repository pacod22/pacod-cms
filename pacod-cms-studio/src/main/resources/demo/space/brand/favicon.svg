<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The space demo's emblem: a four-pointed star crossing an orbit. Written into a website's own
       storage as its favicon, and shown by the magazine set beside the website's name.
       This is XML: never a double hyphen inside a comment, or the file stops parsing. -->
  <defs>
    <radialGradient id="sky" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#2a3d7a"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#sky)"/>
  <ellipse cx="32" cy="32" rx="27" ry="8.5" fill="none" stroke="#c2541b" stroke-width="2.6" transform="rotate(-24 32 32)"/>
  <path d="M32 10 L36.2 27.8 L54 32 L36.2 36.2 L32 54 L27.8 36.2 L10 32 L27.8 27.8 Z" fill="#f6efe1"/>
  <circle cx="49" cy="20.5" r="2.4" fill="#f0a35a"/>
</svg>
