
# ----------------------------------------
# MANAGEMENT CONSOLE PROPERTIES
# ----------------------------------------
#
# This application is the studio: /mgmt/** and /mgmt-assets/**, in a container of its own
# beside pacod-cms-site.

# EMBEDDED SERVER CONFIGURATION (ServerProperties)
#
# 7443, distinct from the site's 8443. There is deliberately NO
# server.servlet.context-path: Caddy proxies /mgmt/ straight through and every mapping,
# securityMatcher and th:href in this module writes the prefix in full. See
# MgmtSecurityConfig for why adding one would be a trap rather than a tidy-up.
server.port=7443

server.servlet.context-path=/
server.http2.enabled=true

# HOW LONG AN OPERATOR STAYS SIGNED IN
#
# The studio session bounds IDLE time and lives in this JVM's heap, so it also ends with the
# container. Either way the next request goes through pacod-id again, whose own session (days, with
# "keep me signed in") signs the operator straight back in without a password. Read at startup.
server.servlet.session.timeout=${MGMT_SESSION_TIMEOUT:8h}

# Sign-in and roles: pacod-id (MgmtSecurityConfig, io.pacod.cms.studio.identity). The issuer is the
# address browsers use; the internal URL is pacod-id's internal listener, for the token, the keys,
# the feed and the catalogue. The studio's origin is what pacod-id has registered as its redirect
# URIs: absolute, never derived from a request.
pacod.id.enabled=${PACOD_ID_ENABLED:true}
pacod.id.issuer=${PACOD_ID_ISSUER:http://id.localhost:8000}
pacod.id.internal-url=${PACOD_ID_INTERNAL_URL:http://pacod-id:8071}
pacod.id.studio-secret=${PACOD_ID_STUDIO_SECRET:}
pacod.id.service-secret=${PACOD_ID_SERVICE_SECRET:}
pacod.id.studio-origin=${STUDIO_ORIGIN:http://studio.localhost:8000}
# The studio's provisioner service account (make id-provisioner): how the creator of a new
# organisation becomes its admin. Blank, only platform admins can create organisations.
pacod.id.provisioner-token=${PACOD_ID_PROVISIONER_TOKEN:}

# The portal: creating organisations and websites (io.pacod.cms.studio.portal).
#
# org-creation is a ceiling: platform-admins restricts creating organisations to platform admins
# whatever the platform screen says; self-service leaves it to that screen. The limits are the
# platform settings' starting values -- the screen owns them once saved. site-domain gives every new
# website <id>.<site-domain> as its first address; blank, the creator names one.
pacod.portal.org-creation=${PACOD_ORG_CREATION:self-service}
pacod.portal.max-orgs-per-user=${PACOD_MAX_ORGS_PER_USER:3}
pacod.portal.max-sites-per-org=${PACOD_MAX_SITES_PER_ORG:5}
pacod.portal.ai-enabled-for-new-orgs=${PACOD_AI_FOR_NEW_ORGS:false}
pacod.portal.site-domain=${PACOD_SITE_DOMAIN:}
# true lets the websites share the studio's registrable domain (StudioDomainCheck): trusted websites only.
pacod.portal.site-domain-shared=${PACOD_SITE_DOMAIN_SHARED:false}

# active profile
spring.profiles.active=prod

# Logging: the pacod convention (pacod-demo/docs/LOGGING.md), carried out by logback-spring.xml.
# stdout gets one event per line, JSON or text; a JSON file goes under app.log.dir as
# <service>.log, rotated at midnight UTC and at 20MB, kept 30 days and 600MB in all. Boot's
# logging.file.* and logging.pattern.* do nothing beside a logback-spring.xml, so there are none.
# Spring Boot's banner would be lines on stdout that are no event.
spring.main.banner-mode=off
# The compose service name: the event's "service" and the file's name. Not the other application's:
# /data/logs is one volume shared by every container, so two applications writing the same filename
# would interleave into one file and roll each other over.
app.log.service=${SERVICE_NAME:cms-studio}
# json or text, any case (anything else: json). The file is JSON whatever this says.
app.log.format=${APP_LOG_FORMAT:json}
# debug, info, warn (or warning), error, any case (anything else: info). The root level; set no
# logging.level.root here, Boot would apply it over this one.
app.log.level=${APP_LOG_LEVEL:info}
# Log files go to an explicit, env-overridable directory. A `~` in a path is not expanded -- it
# names a literal directory called "~".
app.log.dir=${LOG_DIR:/data/logs}

# Logging levels of a few libraries, applied by Boot over logback-spring.xml (which turns
# org.springframework down to WARN).
logging.level.org.springframework.web=INFO
logging.level.org.apache.http=INFO
logging.level.org.apache.tomcat=INFO
logging.level.org.springframework.security=INFO

# MongoDB
# Note the two distinct prefixes in Spring Boot 4: spring.mongodb.* configures the
# driver connection, spring.data.mongodb.* configures Spring Data behaviour.
spring.data.mongodb.auto-index-creation=false

# ARTICLE IMAGE UPLOAD RULES
#
# Two settings, and they answer two different questions:
#
#   app.image.required-width /       what a new upload must measure, and how big it may be.
#   app.image.required-height /      Article images are the site's share cards, list thumbnails
#   app.image.max-bytes              and gallery slides, so these are a LAYOUT rule as much as a
#                                    size one -- change them and the site keeps rendering, with
#                                    the new shape mixed in among the old.
#
#   app.image.dimension-check.       the two limits above, switched INDEPENDENTLY. Four working
#     enabled                        combinations: both, neither, dimensions only, weight only.
#   app.image.file-size-check.       Two flags rather than one because they are two rules that
#     enabled                        merely share a screen -- wanting 1200x800 hero images is no
#                                    reason to also accept 3MB ones, and wanting a large 600x400
#                                    photograph is no reason to give up the layout.
#
#                                    Neither reaches the content-type allow-list or the "is this
#                                    actually an image" check, and that is deliberate: those two
#                                    are not a limit on what an image may be, they are whether it
#                                    is one.
#
#                                    OFF IS NOT UNLIMITED. With file-size-check off an upload is
#                                    still bounded by the multipart limit below and by Caddy, and
#                                    past those the refusal is a bare 413 nothing here can phrase.
#                                    The console states that ceiling rather than going quiet about
#                                    size, because silence reads as "any size".
#
# Both are read at startup, so changing either needs the container recreated, not restarted.
# Neither migrates anything and neither re-checks what is already on the volume: the rule applies
# on upload, which is why /mgmt/images/{id} reports an off-size stored image as a note rather
# than an error. Turning the check off makes that note disappear rather than turn into a fault.
#
# app.image.max-bytes is only effective up to the multipart ceiling below -- see that block. The
# console renders all of it into its own help text through MgmtControllerAdvice.imageRules, so
# the screens and the server cannot disagree about what will be refused.
app.image.required-width=${IMAGE_REQUIRED_WIDTH:600}
app.image.required-height=${IMAGE_REQUIRED_HEIGHT:400}
app.image.max-bytes=${IMAGE_MAX_BYTES:131072}
app.image.dimension-check.enabled=${IMAGE_DIMENSION_CHECK:true}
app.image.file-size-check.enabled=${IMAGE_FILE_SIZE_CHECK:true}

# File upload
#
# The container limit is the LOOSER of the two upload paths, and neither path relies on it as
# its real rule:
#
#   - article images   -> app.image.max-bytes, 128KB by default, checked in validate() unless
#                         app.image.file-size-check.enabled is off, in which case THIS is the
#                         only ceiling an article image has and the console says so on screen
#   - banner creatives -> BannerCreativeService.MAX_BANNER_BYTES, 1MB, checked in validate()
#
# Both are enforced in Java, independently of this setting, so raising it to accommodate an
# animated GIF leaderboard does NOT loosen what an article image may be.
#
# Both are therefore set to Caddy's request_body max_size (4MiB, cms.caddy) rather than to either
# Java constant, so that EVERY upload the proxy admits reaches validate() and comes back as a
# message naming the rule it broke. Setting max-file-size equal to MAX_BANNER_BYTES would make the
# Java check unreachable from a browser -- anything surviving the parser is <= 1MB by definition --
# and a 1.2MB creative would come back as Tomcat's bare "HTTP Status 413 - Payload Too Large" page
# instead. Checked against the running stack.
#
# Past this point the refusal is no longer ours to phrase: Tomcat rejects an oversize multipart
# inside the CSRF filter's first getParameter() call, below Spring, so no @ControllerAdvice ever
# sees it -- also checked. Keeping these at Caddy's ceiling is what makes that corner unreachable
# through the proxy; UploadSizeAdvice covers the residue for anything that bypasses it.
#
# Keep all three in step: raising these above Caddy's max_size just moves the unexplained 413 from
# Tomcat to Caddy. Spring's MB is binary, as Caddy's MiB is; Caddy's MB would be 4,000,000 bytes.
# These properties are the studio's alone: the site has no upload endpoint and does not set them.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

# Draft previews (PreviewTokens): the key the studio signs a preview's address with and the site
# checks it against -- the same value on both. Blank switches previews off; there is no default
# worth publishing, and a key made up at each start could never match the other application's.
# make init writes one into .env, never printed.
pacod.preview.secret=${PACOD_PREVIEW_SECRET:}
