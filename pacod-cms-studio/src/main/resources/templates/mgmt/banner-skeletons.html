<!DOCTYPE html>
<!--/*
  «Шаблони» -- the looks a layout is built from.

  Under /mgmt/banners/layouts/skeletons rather than a prefix of its own, for the reason the layout
  screens are under /mgmt/banners/: only /mgmt/, = /mgmt and /mgmt-assets/ reach this container.
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">

<head th:replace="~{mgmt/fragments :: head(#{banners.skels.title})}"></head>

<body>

<svg th:replace="~{mgmt/fragments :: icons}"></svg>

<div class="shell">
    <th:block th:replace="~{mgmt/fragments :: sidebar('layouts')}"></th:block>

    <div class="main">
        <header th:replace="~{mgmt/fragments :: topbar(#{banners.skels.heading})}"></header>

        <main class="content">
            <div th:replace="~{mgmt/fragments :: flash}"></div>

            <div class="toolbar">
                <form class="toolbar" method="get" th:action="@{/mgmt/banners/layouts/skeletons}"
                      style="flex:1 1 420px; margin:0">
                    <div class="search">
                        <svg class="i"><use href="#i-search"></use></svg>
                        <input type="search" id="search-input" name="q" th:value="${q}"
                               th:placeholder="#{banners.skels.search.placeholder}" th:aria-label="#{banners.skels.search.aria}">
                        <kbd>/</kbd>
                    </div>
                    <button class="btn" type="submit" th:text="#{banners.skels.search.submit}">Search</button>
                    <a class="btn btn-ghost" th:href="@{/mgmt/banners/layouts/skeletons}"
                       th:if="${!#strings.isEmpty(q)}" th:text="#{banners.skels.search.clear}">Clear</a>
                </form>
                <a class="btn btn-ghost" th:href="@{/mgmt/banners/layouts}" th:text="#{banners.skels.toLayouts}">To layouts</a>
                <a class="btn btn-primary" th:href="@{/mgmt/banners/layouts/skeletons/new}">
                    <svg class="i"><use href="#i-plus"></use></svg> <th:block th:text="#{banners.skels.new}">New template</th:block>
                </a>
            </div>

            <div class="card">
                <div class="card-body">
                    <p class="muted" style="margin:0" th:utext="#{banners.skels.intro}">Template intro.</p>
                </div>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                        <tr>
                            <th th:text="#{banners.skels.col.name}">Name</th>
                            <th th:text="#{banners.skels.col.title}">Title</th>
                            <th class="shrink" th:text="#{banners.skels.col.size}">Size</th>
                            <th class="shrink">GTM</th>
                            <th class="shrink" th:text="#{banners.skels.col.builtIn}">Built in</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${skeletons}"
                            th:attr="data-href=@{/mgmt/banners/layouts/skeletons/{id}(id=${s.id})}">
                            <td><code th:text="${s.id}">sidebar</code></td>
                            <td class="title-cell">
                                <a th:href="@{/mgmt/banners/layouts/skeletons/{id}(id=${s.id})}"
                                   th:text="${s.title}">Sidebar 300x250</a>
                            </td>
                            <td>
                                <span th:if="${s.width != null and s.height != null}"
                                      th:text="${s.width} + '×' + ${s.height}">300×250</span>
                                <span th:unless="${s.width != null and s.height != null}"
                                      class="muted" th:text="#{banners.skels.byFrame}">by the frame</span>
                            </td>
                            <td>
                                <code th:if="${s.gtmId != null}" th:text="${s.gtmId}">GTM-XXXX</code>
                                <span th:unless="${s.gtmId != null}" class="muted">—</span>
                            </td>
                            <td>
                                <span class="badge published" th:if="${s.builtIn}" th:text="#{banners.skels.yes}">yes</span>
                                <span class="badge plain" th:unless="${s.builtIn}" th:text="#{banners.skels.no}">no</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="empty" th:if="${skeletons.isEmpty()}">
                    <svg class="i"><use href="#i-code"></use></svg>
                    <span th:text="${#strings.isEmpty(q)}
                            ? #{banners.skels.empty}
                            : #{banners.skels.empty.search}"></span>
                </div>
            </div>
        </main>
    </div>
</div>

<script th:src="@{/mgmt-assets/mgmt.js}"></script>
</body>
</html>
