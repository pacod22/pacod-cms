<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<!--/*
  Editing ONE existing translation of an article -- its title, description and body in one
  language, and nothing else.

  A screen of its own rather than the article editor with a language switch: that editor's form
  carries the authors, categories, status and date, and MgmtArticleService.save writes every field
  it carries. This form (TranslationForm) carries the three texts only, so a translation save
  cannot touch the classification, and a save of the original cannot touch a translation.

  The two ids below are reused from the article editor on purpose, as page-edit.html does:

    * the body textarea is id="text", which is what mgmt.js binds TinyMCE to -- and with it the
      whole configuration that stops TinyMCE rewriting stored markup, plus the fidelity warning
      in #fidelity-warning. Rename it and the editor silently does not appear.
    * the form is id="article-form", which the save bar's `form=` attribute, Ctrl/Cmd+S and the
      unsaved-changes guard all look for.

  There is no previousText for a translation -- that field covers the original body alone. The
  fidelity warning still fires on open, and a damaged translation can be regenerated by a
  translation job.
*/-->

<head th:replace="~{mgmt/fragments :: head(#{articles.tr.title})}"></head>

<body>
<svg th:replace="~{mgmt/fragments :: icons}"></svg>

<div class="shell">
    <th:block th:replace="~{mgmt/fragments :: sidebar('articles')}"></th:block>

    <div class="main">
        <header th:replace="~{mgmt/fragments :: topbar(#{articles.tr.title})}"></header>

        <main class="content">
            <div th:replace="~{mgmt/fragments :: flash}"></div>

            <form id="article-form" method="post" th:object="${form}"
                  th:action="@{/mgmt/articles/{id}/translations/{lang}(id=${article.id}, lang=${lang})}">

                <div th:replace="~{mgmt/fragments :: errors}"></div>

                <div class="card">
                    <h2>
                        <svg class="i"><use href="#i-file-text"></use></svg>
                        <span th:text="#{articles.tr.heading(${languageName})}">Translation</span>
                        <span class="hint" th:text="|№ ${article.id}|">№ 1</span>
                    </h2>

                    <div class="card-body">
                        <div class="field">
                            <label for="title" th:text="#{articles.c.title}">Title</label>
                            <textarea id="title" th:field="*{title}" rows="2"></textarea>
                            <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
                        </div>

                        <div class="field">
                            <label for="description" th:text="#{articles.c.shortDescription}">Short description</label>
                            <textarea id="description" th:field="*{description}" rows="3"></textarea>
                        </div>

                        <div class="field">
                            <div class="field-head">
                                <label for="text" th:text="#{articles.c.text}">Text</label>
                            </div>
                            <!--/* Filled in by mgmt.js only when opening the text changed its HTML. */-->
                            <div id="fidelity-warning"></div>
                            <!--/* id="text" -- see the file header. This is what TinyMCE binds to. */-->
                            <textarea id="text" th:field="*{text}" rows="20"></textarea>
                            <span class="field-error" th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></span>
                        </div>
                    </div>

                    <div th:replace="~{mgmt/fragments :: articleLanguages(${article}, ${lang}, ${translations})}"></div>
                </div>
            </form>

            <!--/*
              The original, for the translator to read against. Outside the form and with
              no name= anywhere: it is reference, and must never be posted as the translation.
              The body is shown as escaped text rather than rendered -- stored markup rendered
              into the console would bring its <style> blocks with it.
            */-->
            <div class="card">
                <h2>
                    <svg class="i"><use href="#i-file-text"></use></svg>
                    <th:block th:text="#{articles.tr.original}">Original</th:block>
                </h2>
                <div class="card-body">
                    <p style="margin-top:0"><b th:text="${article.title}">Title</b></p>
                    <p class="muted" th:if="${!#strings.isEmpty(article.description)}"
                       th:text="${article.description}">Description</p>
                    <details>
                        <summary th:text="#{articles.tr.textHtml}">Text (HTML)</summary>
                        <textarea readonly rows="12" style="width:100%"
                                  th:text="${article.text}"></textarea>
                    </details>
                </div>
            </div>

            <!--/*
              Its own POST, so outside the form above -- HTML forbids nesting. Same arrangement as
              page-edit.html's remove-translation card.
            */-->
            <div class="card danger">
                <h2><svg class="i"><use href="#i-trash"></use></svg> <th:block th:text="#{articles.tr.delete.heading}">Delete the translation</th:block></h2>
                <div class="card-body">
                    <p class="muted" style="margin-top:0">
                        <th:block th:text="#{articles.tr.delete.before}">Deletes the title, description and text in</th:block>
                        <b th:text="${languageName}">language</b><th:block th:text="#{articles.tr.delete.after}">. Readers will see the English text.</th:block>
                    </p>
                    <form method="post" th:data-confirm="#{articles.tr.delete.confirm}"
                          th:action="@{/mgmt/articles/{id}/translations/{lang}/delete(id=${article.id}, lang=${lang})}">
                        <button class="btn btn-danger" type="submit">
                            <svg class="i"><use href="#i-trash"></use></svg> <th:block th:text="#{articles.tr.delete}">Delete translation</th:block>
                        </button>
                    </form>
                </div>
            </div>
        </main>

        <div class="savebar">
            <span class="status" id="save-status" th:text="#{articles.c.ctrlS}">Ctrl+S saves</span>
            <a class="btn btn-ghost" th:href="@{/mgmt/articles/{id}/preview(id=${article.id}, lang=${lang})}"
               target="_blank" rel="noopener">
                <svg class="i"><use href="#i-eye"></use></svg> <th:block th:text="#{articles.c.preview}">Preview</th:block>
            </a>
            <a class="btn" th:href="@{/mgmt/articles/{id}(id=${article.id})}" th:text="#{articles.tr.toArticle}">Back to the article</a>
            <button class="btn btn-primary" type="submit" form="article-form">
                <svg class="i"><use href="#i-save"></use></svg> <th:block th:text="#{articles.c.save}">Save</th:block>
            </button>
        </div>
    </div>
</div>

<script th:src="@{/mgmt-assets/tinymce/tinymce.min.js}" referrerpolicy="origin"></script>
<script th:src="@{/mgmt-assets/mgmt.js}"></script>
</body>
</html>
