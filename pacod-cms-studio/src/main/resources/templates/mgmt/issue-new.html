<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<!--/*
  A new journal issue: its volume, number and month, the next ones suggested. Everything else is
  edited on the issue's own screen, where creating lands.
*/-->

<head th:replace="~{mgmt/fragments :: head(#{issues.new})}"></head>

<body>
<svg th:replace="~{mgmt/fragments :: icons}"></svg>

<div class="shell">
    <th:block th:replace="~{mgmt/fragments :: sidebar('issues')}"></th:block>

    <div class="main">
        <header th:replace="~{mgmt/fragments :: topbar(#{issues.new})}"></header>

        <main class="content">
            <div th:replace="~{mgmt/fragments :: flash}"></div>

            <form class="form-page" method="post" th:action="@{/mgmt/issues}">
                <div class="card">
                    <h2><svg class="i"><use href="#i-book"></use></svg> <span th:text="#{issues.section.details}">Details</span></h2>
                    <div class="card-body">
                        <div class="grid-2">
                            <div class="field">
                                <label for="volume" th:text="#{issues.field.volume}">Volume</label>
                                <input type="number" id="volume" name="volume" min="1" max="9999" required th:value="${suggestion.volume}">
                            </div>
                            <div class="field">
                                <label for="number" th:text="#{issues.field.number}">Number</label>
                                <input type="number" id="number" name="number" min="1" max="999" required th:value="${suggestion.number}">
                            </div>
                            <div class="field">
                                <label for="year" th:text="#{issues.field.year}">Year</label>
                                <input type="number" id="year" name="year" min="1900" max="2999" required th:value="${suggestion.year}">
                            </div>
                            <div class="field">
                                <label for="month" th:text="#{issues.field.month}">Month</label>
                                <input type="number" id="month" name="month" min="1" max="12" required th:value="${suggestion.month}">
                            </div>
                        </div>
                    </div>
                    <div class="card-foot">
                        <a class="btn btn-ghost" th:href="@{/mgmt/issues}" th:text="#{issues.back}">All issues</a>
                        <button class="btn btn-primary" type="submit">
                            <svg class="i"><use href="#i-plus"></use></svg> <span th:text="#{issues.create}">Create</span>
                        </button>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>
</body>
</html>
