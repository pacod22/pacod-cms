ops.crawl.footnote=Роботы не учитываются в «Статистике» — ни в просмотрах и посетителях, ни в показах и кликах рекламы, ни в счётчике статей. Здесь все запросы к сайту от роботов и автоматизированных клиентов, с любым кодом ответа, включая <code>/robots.txt</code> и <code>/sitemap.xml</code>. Их запросы изображений, рекламных баннеров и PDF-файлов под <code>/assets/</code> и <code>/resources/</code> здесь тоже есть. В «Прочих» также наши собственные инструменты, например <code>make smoke</code> (curl); предпросмотры из студии и создание PDF не записываются. Проверка DNS возможна только для поисковых систем, публикующих свои адреса (Google, Bing, Yandex, Baidu, Apple); для остальных это «не проверен», а не «поддельный».
