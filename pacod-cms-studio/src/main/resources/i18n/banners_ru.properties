banners.skels.intro=Шаблон задаёт оформление и рамку макета: заголовочную часть <code>index.html</code>, блок Google Tag Manager, контейнер <code>.banner-container-inline</code> и <code>css/banner.css</code>. Смена кадров <b>не</b> берётся из шаблона: консоль записывает в каждую папку свой <code>js/banner.js</code>, потому что вручную заданное число кадров указывается в трёх местах, и папка с тремя кадрами на скрипте для двух навсегда показывает два, без единой ошибки.
