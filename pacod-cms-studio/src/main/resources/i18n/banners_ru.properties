banners.files.intro.imported=Этот макет экспортирован рекламодателем. Консоль не понимает его кадры: смена кадров находится внутри его собственного скрипта. Адрес, на который ведёт баннер, обычно — строка <code>clickTag</code> или <code>window.open(…)</code> в файле <code>.js</code>: найдите его и измените здесь. Изображения заменяются загрузкой с сохранением имён, потому что скрипт ищет их по имени.
