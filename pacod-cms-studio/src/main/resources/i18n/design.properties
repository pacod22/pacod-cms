# Design assist (DesignAssist): drafts from a description
design.assist.title=Describe it
design.assist.theme.intro=Describe the look you want. AI drafts the theme''s colours, fonts and widths; only the draft changes, and the values that do not fit are named.
design.assist.theme.example=Calm and bright, deep green links, a serif for headings.
design.assist.layout.intro=Describe the page you want. AI drafts its sections from those this template has; only the draft changes.
design.assist.layout.example=A large lead story, then the latest five as a list, and a newsletter call to action.
design.assist.submit=Draft it
design.assist.theme.applied=The draft has {0,number,#} new values. Preview it, then publish it or undo the change.
design.assist.layout.applied=The draft has {0,number,#} new sections. Preview it, then publish it or undo the change.
design.assist.refused=Left out: {0}.
design.assist.mode.refine=Change the current draft as described
design.assist.mode.replace=Start over from the description
design.assist.undo=Undo the AI''s change
design.assist.undo.hint=Brings back the draft from before; press again to redo.
design.assist.undone=The draft is back to what it was. Undo again to redo the AI''s change.
design.assist.undo.none=There is no change by the AI to undo.
design.assist.site.title=The whole website from one description
design.assist.site.intro=Describe the website you want. AI drafts the theme and the layout of every page, one after another in the background; only the drafts change, each can be undone on its own screen, and nothing reaches readers until it is published.
design.assist.site.example=A calm local paper: light paper colours, a serif for headings, the newest stories first, a newsletter box beside every article.
design.assist.site.make=Draft everything
design.assist.site.queued=Queued. The drafts appear as the job works through them.
design.assist.site.running=A design job is running for this website.
design.assist.site.follow=Follow it
design.assist.site.cancel=Stop it
