banners.skel.delete.heading=Gerüst löschen
banners.skel.delete.help=Wird abgelehnt, solange eine Vorlage darauf aufbaut: Der Ordner wird bei jedem Speichern aus dem Gerüst neu geschrieben, sodass eine Vorlage ohne Gerüst nicht mehr bearbeitet werden kann. Nichts wird kaskadierend gelöscht.
banners.skel.delete.confirm=Dieses Gerüst löschen?
banners.skel.delete.submit=Gerüst löschen
banners.skel.builtIn=Dies ist ein eingebautes Gerüst. Es kann bearbeitet, aber nicht gelöscht werden: Eingebaute Gerüste werden nur angelegt, solange die Sammlung leer ist, das Löschen wäre also endgültig, ohne dass etwas darauf hinweist.
