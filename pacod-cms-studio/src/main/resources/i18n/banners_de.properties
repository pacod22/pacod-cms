banners.files.intro.imported=Diese Vorlage wurde vom Werbekunden exportiert. Die Konsole versteht ihre Frames nicht: Die Rotation steckt in dessen eigenem Skript. Die Zieladresse des Banners ist meist eine <code>clickTag</code>-Zeichenkette oder <code>window.open(…)</code> in der <code>.js</code>-Datei: Suchen Sie sie und ändern Sie sie hier. Bilder werden durch Hochladen ersetzt und behalten ihre Namen, weil das Skript sie über den Namen sucht.
banners.files.intro.built.before=Diese Vorlage wird von der Konsole zusammengesetzt.
banners.files.intro.built.after=, <code>css/banner.css</code> und <code>js/banner.js</code> werden bei jedem Speichern neu geschrieben und daher in der Vorlage selbst geändert, nicht hier. Die übrigen Dateien gehören Ihnen.
