banners.skels.intro=Das Gerüst liefert Gestaltung und Rahmen einer Vorlage: den Kopf von <code>index.html</code>, den Google-Tag-Manager-Block, den Container <code>.banner-container-inline</code> und <code>css/banner.css</code>. Der Bildwechsel kommt <b>nicht</b> aus dem Gerüst: Die Konsole schreibt in jeden Ordner ein eigenes <code>js/banner.js</code>, denn eine von Hand geschriebene Bildanzahl steht an drei Stellen, und ein Ordner mit drei Bildern auf einem Skript für zwei zeigt für immer zwei, ohne irgendwo einen Fehler.
