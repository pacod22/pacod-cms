banners.skel.html.intro=Muss genau ein Element mit der Klasse <code>banner-container-inline</code> enthalten (dort trägt die Konsole die Bilder ein) sowie <code>&lt;link href="css/banner.css"&gt;</code>, <code>&lt;script src="js/banner.js"&gt;</code> und einen Aufruf von <code>banner()</code>. Fehlt eines davon, wird der Ordner ohne Fehler veröffentlicht und zeigt das Falsche: ohne Gestaltung oder nur das erste Bild.
