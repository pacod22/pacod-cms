# ---- crawler files (site-files.html, MgmtSiteFilesController)
siteFiles.title=Crawler-Dateien
siteFiles.intro=Die Dateien, die Suchmaschinen und KI-Assistenten im Stammverzeichnis der Website lesen. Jede wird aus dem Inhalt erzeugt, mit Ihren Ergänzungen erzeugt, ist Ihr eigener Text oder ist aus.
siteFiles.about.robots=robots.txt sagt Crawlern, was sie abrufen dürfen und wo die Sitemap liegt.
siteFiles.about.sitemap=sitemap.xml nennt jede Adresse, die eine Suchmaschine kennen sollte: Seiten, Rubriken, Ausgaben und die neuesten veröffentlichten Artikel.
siteFiles.about.llms=llms.txt ist ein kurzer Führer durch die Website für Sprachmodelle: ihr Name, ihr Thema und Links zu Seiten, Rubriken und den neuesten Artikeln.
siteFiles.about.llms-full=llms-full.txt enthält die festen Seiten und die neuesten Artikel vollständig als Markdown, für Sprachmodelle, die eine Website am Stück lesen. Bei 5 MB wird abgeschnitten.
siteFiles.mode=Die Website antwortet mit
siteFiles.mode.AUTO.hint=Aus dem Inhalt erzeugt; folgt jeder Änderung.
siteFiles.mode.AUTO_PLUS.hint=Erzeugt, mit den Ergänzungen und Ausschlüssen unten.
siteFiles.mode.CUSTOM.hint=Der Text unten, genau wie geschrieben; er folgt dem Inhalt nicht mehr.
siteFiles.mode.OFF.hint=Nichts: die Adresse antwortet mit 404.
siteFiles.options=Die erzeugte Datei
siteFiles.options.inactive=Gilt, solange die Datei erzeugt wird.
