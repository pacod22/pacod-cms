ops.crawl.footnote=Crawler werden in «Statistik» nicht gezählt — weder in Aufrufen und Besuchern noch in Impressionen und Klicks der Werbung oder im Artikelzähler. Hier stehen alle Anfragen von Crawlern und automatisierten Clients an die Website, mit jedem Antwortcode, einschließlich <code>/robots.txt</code> und <code>/sitemap.xml</code>. Ihre Abrufe von Bildern, Werbebannern und PDF-Dateien unter <code>/assets/</code> und <code>/resources/</code> stehen ebenfalls hier. Unter «Sonstige» stehen auch unsere eigenen Werkzeuge, etwa <code>make smoke</code> (curl); Vorschauen aus dem Studio und die PDF-Erzeugung werden nicht erfasst. Eine DNS-Prüfung ist nur für Suchmaschinen möglich, die ihre Adressen veröffentlichen (Google, Bing, Yandex, Baidu, Apple); für die übrigen lautet sie «nicht geprüft», nicht «gefälscht».
