# Design assist (DesignAssist): drafts from a description
design.assist.title=Beschreiben Sie es
design.assist.theme.intro=Beschreiben Sie das gewünschte Aussehen. Die KI entwirft Farben, Schriften und Breiten des Themes; nur der Entwurf ändert sich, und unpassende Werte werden genannt.
design.assist.theme.example=Ruhig und hell, dunkelgrüne Links, eine Serifenschrift für Überschriften.
design.assist.layout.intro=Beschreiben Sie die gewünschte Seite. Die KI entwirft ihre Abschnitte aus denen dieser Vorlage; nur der Entwurf ändert sich.
design.assist.layout.example=Ein großer Aufmacher, dann die neuesten fünf als Liste und ein Newsletter-Aufruf.
design.assist.submit=Entwerfen
design.assist.theme.applied=Der Entwurf hat {0,number,#} neue Werte. Sehen Sie ihn an, dann veröffentlichen Sie ihn oder machen die Änderung rückgängig.
design.assist.layout.applied=Der Entwurf hat {0,number,#} neue Abschnitte. Sehen Sie ihn an, dann veröffentlichen Sie ihn oder machen die Änderung rückgängig.
design.assist.refused=Weggelassen: {0}.
design.assist.mode.refine=Den aktuellen Entwurf wie beschrieben ändern
design.assist.mode.replace=Nach der Beschreibung neu beginnen
design.assist.undo=Änderung der KI rückgängig machen
design.assist.undo.hint=Holt den Entwurf von vorher zurück; erneut drücken stellt sie wieder her.
design.assist.undone=Der Entwurf ist wieder wie vorher. Erneut rückgängig machen stellt die Änderung der KI wieder her.
design.assist.undo.none=Es gibt keine Änderung der KI zum Rückgängigmachen.
design.assist.site.title=Die ganze Website aus einer Beschreibung
design.assist.site.intro=Beschreiben Sie die gewünschte Website. Die KI entwirft das Theme und das Layout jeder Seite, nacheinander im Hintergrund; nur die Entwürfe ändern sich, jeder lässt sich auf seinem Bildschirm rückgängig machen, und nichts erreicht die Leser, bevor es veröffentlicht ist.
design.assist.site.example=Eine ruhige Lokalzeitung: helle Papierfarben, eine Serifenschrift für Überschriften, die neuesten Beiträge zuerst, ein Newsletter-Kasten neben jedem Artikel.
design.assist.site.make=Alles entwerfen
design.assist.site.queued=In der Warteschlange. Die Entwürfe erscheinen, während der Auftrag sie abarbeitet.
design.assist.site.running=Für diese Website läuft ein Design-Auftrag.
design.assist.site.follow=Verfolgen
design.assist.site.cancel=Anhalten
design.assist.site.cancelled=Der Design-Auftrag ist angehalten. Bereits erstellte Entwürfe bleiben.
