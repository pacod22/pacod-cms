ops.crawl.footnote=Роботите не се броят в «Статистика» — нито в прегледите и посетителите, нито в импресиите и кликовете на рекламите, нито в брояча на статиите. Тук са всички заявки към сайта от роботи и автоматизирани клиенти, с всеки код на отговор, включително <code>/robots.txt</code> и <code>/sitemap.xml</code>. Тук са и заявките им за изображения, рекламни банери и PDF файлове под <code>/assets/</code> и <code>/resources/</code>. В «Други» са и собствените ни инструменти, например <code>make smoke</code> (curl); прегледите от студиото и генерирането на PDF не се записват. Проверката по DNS е възможна само за търсачките, които публикуват адресите си (Google, Bing, Yandex, Baidu, Apple); за останалите е «непроверен», не «фалшив».
