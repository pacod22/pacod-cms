# Console text, area: common. Language: English.
#
# Every key exists in all four files (<area>.properties = English, the base; _bg, _de, _ru).
# Every value goes through java.text.MessageFormat, so an apostrophe is ALWAYS written ''.
# Markup in a value is allowed only for keys that take no {n} arguments (they are th:utext'ed).
# Counts are written "Label: {0}", never inside a sentence -- Russian plurals do not fit
# ChoiceFormat. MgmtBundleTest checks all of this.

