# Design assist (DesignAssist): drafts from a description
design.assist.title=Опишите
design.assist.theme.intro=Опишите нужный вид. ИИ составит цвета, шрифты и ширины темы; меняется только черновик, а неподходящие значения будут названы.
design.assist.theme.example=Спокойно и светло, тёмно-зелёные ссылки, шрифт с засечками для заголовков.
design.assist.layout.intro=Опишите нужную страницу. ИИ составит её секции из тех, что есть в шаблоне; меняется только черновик.
design.assist.layout.example=Крупная главная статья, затем пять последних списком и призыв подписаться на рассылку.
design.assist.submit=Составить
design.assist.theme.applied=В черновике {0,number,#} новых значений. Просмотрите его, затем опубликуйте или отмените изменение.
design.assist.layout.applied=В черновике {0,number,#} новых секций. Просмотрите его, затем опубликуйте или отмените изменение.
design.assist.refused=Пропущено: {0}.
design.assist.mode.refine=Изменить текущий черновик по описанию
design.assist.mode.replace=Начать заново по описанию
design.assist.undo=Отменить изменение ИИ
design.assist.undo.hint=Возвращает прежний черновик; нажмите ещё раз, чтобы повторить.
design.assist.undone=Черновик снова прежний. Отмените ещё раз, чтобы вернуть изменение ИИ.
design.assist.undo.none=Нет изменения ИИ, которое можно отменить.
design.assist.site.title=Весь сайт по одному описанию
design.assist.site.intro=Опишите нужный сайт. ИИ составит тему и раскладку каждой страницы, одну за другой в фоновом режиме; меняются только черновики, каждый можно отменить на его экране, и ничего не попадёт к читателям до публикации.
design.assist.site.example=Спокойная местная газета: светлые бумажные цвета, шрифт с засечками для заголовков, сначала самые новые материалы, врезка с рассылкой рядом с каждой статьёй.
