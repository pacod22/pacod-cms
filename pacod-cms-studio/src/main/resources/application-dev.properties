# The format used for the keystore
server.ssl.key-store-type=PKCS12
# The path to the keystore containing the certificate
server.ssl.key-store=${SSL_KEYSTORE:file:./config/keystore.p12}
# The password used to generate the certificate
# No default: the keystore is supplied at deploy time, never baked into the jar.
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
# The alias mapped to the certificate
server.ssl.key-alias=${SSL_KEY_ALIAS:pacod-cms}

#enable/diable https
server.ssl.enabled=${SSL_ENABLED:false}

#ssl ciphers
server.ssl.ciphers=TLS_RSA_WITH_AES_128_CBC_SHA256,ECDHE-RSA-AES128-GCM-SHA256

# SSL protocol to use.
server.ssl.protocol=TLS

# Enabled SSL protocols. TLSv1.1 dropped: deprecated and disabled by default in modern JDKs.
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3


# Thymeleaf
spring.thymeleaf.check-template-location=true
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.content-type=text/html
spring.thymeleaf.cache=false

# Logs settings
app.log.dir=${LOG_DIR:${user.home}/data/logs}

logging.level.javax.net.ssl=INFO
logging.level.org.apache.http=INFO
logging.level.org.thymeleaf=INFO


# Every website's files sit under one root, in a folder of its own: sites/<site id>/,
# laid out like its public addresses (assets/..., resources/...). The folder settings below
# are templates: {site} is replaced by the website being served or edited (SiteStorage).
pacod.storage.root=${STORAGE_ROOT:${user.home}/data/pacod-cms}

# Article images, written by the studio's upload.
app.image.folder=${pacod.storage.root}/sites/{site}/assets/img/articles


# Banner creatives and HTML5 layout folders. Stored names are prefixed with the banner id.
app.banner.folder=${pacod.storage.root}/sites/{site}/resources/banners
# Copies of adopted banner folders, outside the trees the public site serves (assets/, resources/).
app.banner.backup-folder=${pacod.storage.root}/sites/{site}/backups/banners

# Article settings
# Consumed by core's ArticleService, which has no defaults for these - the context fails without
# them even though the console never writes a default-titled article.
app.article.defaultTitle=
app.article.defaultText=
app.article.defaultDescription=


# Background jobs (/mgmt/jobs, JobRunner): how many run at once, and how many of one
# organisation's. A worker that stops renewing its lease for `lease` loses the job to the next
# claim, which runs it again from the start.
pacod.jobs.workers=${PACOD_JOBS_WORKERS:2}
pacod.jobs.per-organisation=${PACOD_JOBS_PER_ORGANISATION:1}
pacod.jobs.lease=60s

# The AI gateway (pacod-gw, OpenAI's chat API): its address, the studio's key, and the model each
# feature asks for -- a pool or template name (@fast) or a model id. Blank address or key: AI is
# not set up, whatever the organisations' switches say. x-gw-tags only when the gateway's workspace
# declares the keys site and feature.
pacod.ai.gateway-url=${PACOD_GW_URL:}
pacod.ai.api-key=${PACOD_GW_API_KEY:}
pacod.ai.model=${PACOD_AI_MODEL:@fast}
pacod.ai.tags=${PACOD_AI_TAGS:false}

# PDF export: Gotenberg (blank switches it off) and the site's address on the compose network,
# from which Gotenberg's Chromium -- allowed nowhere else -- reads the print view.
pacod.pdf.gotenberg-url=${PACOD_PDF_GOTENBERG_URL:}
pacod.pdf.site-url=${PACOD_PDF_SITE_URL:http://site:8443}

# Mongo DB configuration
# The control-plane database: organisations, websites, domains, accounts. Each website's
# content is in a database of its own, site_<id>, chosen per request (MongoConfig).
spring.mongodb.database=${MONGO_DATABASE:pacod_cms}
# The application account is created in admin with rights on every database.
spring.mongodb.authentication-database=${MONGO_AUTH_DB:admin}
spring.mongodb.host=${MONGO_HOST:pacod-cms-mongo}
spring.mongodb.port=27017
spring.mongodb.password=${MONGO_PASSWORD}
spring.mongodb.username=${MONGO_USER:pacod-cms}

# CORS
# The public default (see CorsConfig) is the live site only. Locally the stack answers on
# several ports at once -- Caddy on 8000 (http) and 8443 (https), plus the applications
# directly on 7070/8080 when you bypass Caddy -- so dev allows any localhost port as well.
# Registered as patterns, so credentials stay allowed; a bare "*" is rejected at startup.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],https://localhost:[*],http://127.0.0.1:[*],https://127.0.0.1:[*]}

# How a website's public address is spelled from the studio: banner previews are framed from it,
# never from the studio's own origin. Port blank means the scheme's default (StudioSites); the
# default is Caddy's published HTTP port, which compose hands this container as HTTP_PORT.
pacod.site.public-scheme=${SITE_PUBLIC_SCHEME:http}
pacod.site.public-port=${SITE_PUBLIC_PORT:${HTTP_PORT:}}
