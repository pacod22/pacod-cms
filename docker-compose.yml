# pacod-cms on the shared network pacod-net: the app file. It holds cms's own services --
# MongoDB (`cms-mongo`), the public site (`cms-site`), the studio (`cms-studio`) and the PDF
# renderer (`cms-gotenberg`). The shared components they use (pacod-caddy, pacod-id and its
# pacod-postgres, the development gateway pacod-gw, pacod-mailpit) come from
# docker-compose.standalone.yml, which `make up` loads with this file, or from the full stack
# (pacod-demo), which loads only this file and provides them once. The naming convention is
# pacod-demo/docs/NETWORK.md. The studio also joins pacod-admin-net, the internal network on
# which pacod-id's internal listener (pacod-id-internal:8071) listens, and nothing else does.
#
# One stack hosts every website. Caddy sends the studio's host (STUDIO_HOST, studio.localhost by
# default) to the studio, pacod-id's (ID_HOST) to pacod-id, and every other host to the public site,
# which looks the host up in the control plane and answers 404 for one that belongs to no website.
# Its rules for cms's two sites are platform/caddy/cms.caddy.
#
# Data: MongoDB keeps the control plane in MONGO_DATABASE (pacod_cms) and each website's content
# in a database of its own (site_<id>); files are under STORAGE_HOST, one folder per website
# (sites/<id>/...).
#
# Always through make (make init, then make up): it passes the environment's preset
# (env/<ENV>.env), this machine's .env and an optional .env-local as --env-file, in that order.
# The defaults below are a developer machine's; docs/RUNNING.md describes dev, stage and prod.

# Every service's container log rotates (pacod-demo/docs/LOGGING.md, section 2): 10 MB a file, five
# files. YAML anchors do not cross files, so each compose file declares its own copy.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  cms-mongo:
    # An exact release: a cached `mongo:8` is never pulled again, and releases before 8.3.9 (8.0.30
    # in the 8.0 line) refuse to start on Linux 6.19 and newer, Docker Desktop's VM included
    # (SERVER-121912, SERVER-125742). 8.3 also opens data written with feature compatibility 8.0
    # or 8.2.
    image: mongo:8.3.13
    container_name: cms-mongo
    logging: *logging
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-pacod-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run make init}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-pacod_cms}
      # Consumed by the init script, not by the mongo image itself.
      MONGO_APP_USER: ${MONGO_USER:-pacod-cms}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:?run make init}
    ports:
      # PUBLISH_IP: blank publishes on every interface (dev); stage and prod set 127.0.0.1.
      - "${PUBLISH_IP:-}:${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MONGO_DATA_DIR:-./.data/mongo}:/data/db
      - ${MONGO_BACKUP_DIR:-./.data/backup/pacod-cms}:/data/backup
      - ${MONGO_CONFIG:-./docker/mongo/config/mongod.conf}:/etc/mongod.conf:ro
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - pacod-net
    healthcheck:
      # The applications must not start against a MongoDB that is still initialising.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  cms-site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: pacod-cms-site
    container_name: cms-site
    logging: *logging
    restart: unless-stopped
    depends_on:
      cms-mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8443
      # The studio's origin: the one page allowed to frame this site's banner folders and drafts.
      STUDIO_ORIGIN: ${STUDIO_ORIGIN:-http://studio.localhost:${HTTP_PORT:-8000}}
      # The draft-preview key, the studio's too (make init writes it into .env). Empty: no
      # previews. No default: a published one would be a published key.
      PACOD_PREVIEW_SECRET: ${PACOD_PREVIEW_SECRET:-}
      # Behind Caddy: trust X-Forwarded-Proto/Host so redirects and absolute URLs are right.
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
      SSL_ENABLED: ${SSL_ENABLED:-false}
      # SSL_KEYSTORE: file:/app/config/keystore.p12
      # SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-}
      MONGO_HOST: cms-mongo
      MONGO_USER: ${MONGO_USER:-pacod-cms}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?run make init}
      # No value on purpose: Compose then passes the variable through from the environment and
      # leaves it UNSET when there is none. `${CORS_ALLOWED_ORIGINS:-}` would instead define it
      # as the empty string, which is a value -- Spring's `${...:default}` would stop applying
      # and the allowed-origin list would come out empty.
      CORS_ALLOWED_ORIGINS:
      # This service is the only WRITER of the traffic statistics; `cms-studio` only reads them, which
      # is why the salt is set here and nowhere else. Blank is a working configuration -- the
      # application generates an ephemeral one and logs that it did.
      METRICS_VISITOR_SALT: ${METRICS_VISITOR_SALT:-}
      # The crawler statistics (/mgmt/crawlers), also written only by this service. TRACKING gates
      # the recording; crawlers are kept out of the reader numbers either way. VERIFY is the
      # reverse/forward DNS check that tells a real Googlebot from a forged one -- see .env.example.
      CRAWLER_TRACKING: ${CRAWLER_TRACKING:-true}
      CRAWLER_VERIFY: ${CRAWLER_VERIFY:-true}
      # Logging (pacod-demo/docs/LOGGING.md): the event's service name, the level (debug, info, warn,
      # error) and stdout's format (json or text; the file under LOG_DIR is JSON either way).
      SERVICE_NAME: cms-site
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
      LOG_DIR: /data/logs
      # Every website's files, one folder each (sites/<id>/assets/..., sites/<id>/resources/...).
      # The public site serves /assets/** and /resources/** out of the folder of the website the
      # request's host belongs to (MediaController).
      STORAGE_ROOT: /data/storage
    ports:
      - "${PUBLISH_IP:-}:${WEB_PORT:-8080}:8443"
    volumes:
      - ${LOG_DIR_HOST:-./.data/logs}:/data/logs
      # Read-only: the public site writes no file. Uploads and deletions are the studio's.
      - ${STORAGE_HOST:-./.data/storage}:/data/storage:ro
      # - ./config:/app/config:ro   # uncomment to supply a TLS keystore
    networks:
      - pacod-net
    healthcheck:
      # /web/v1/health is public, outside every website, so it answers before any website exists.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8443/web/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # The studio. Its own container so a studio deploy cannot take the public sites down, and so the
  # site's image carries neither the vendored editor nor any upload endpoint. Reached at
  # STUDIO_HOST through Caddy; a website's screens are under /sites/<id>/mgmt/....
  cms-studio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: pacod-cms-studio
    container_name: cms-studio
    logging: *logging
    restart: unless-stopped
    depends_on:
      cms-mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 7443
      # Required, not optional. The studio's first answer to a browser is a redirect (/mgmt/ to
      # /mgmt/sites, then to /mgmt/login), and without this the port is dropped from the Location
      # header -- the exact failure `make smoke` prints the redirect URL to catch.
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
      SSL_ENABLED: ${SSL_ENABLED:-false}
      # SSL_KEYSTORE: file:/app/config/keystore.p12
      # SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-}
      MONGO_HOST: cms-mongo
      MONGO_USER: ${MONGO_USER:-pacod-cms}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?run make init}
      # How long an idle studio session lasts. When it ends -- or the container restarts -- the next
      # request goes through pacod-id again, whose own session signs the operator back in.
      MGMT_SESSION_TIMEOUT: ${MGMT_SESSION_TIMEOUT:-8h}
      # Background jobs, run by the studio itself (/mgmt/jobs). PDF export renders through
      # Gotenberg below, which reads the site's print view at PACOD_PDF_SITE_URL on this network;
      # blank PACOD_PDF_GOTENBERG_URL switches PDF export off.
      PACOD_PDF_GOTENBERG_URL: ${PACOD_PDF_GOTENBERG_URL:-http://cms-gotenberg:3000}
      PACOD_PDF_SITE_URL: http://cms-site:8443
      PACOD_JOBS_WORKERS:
      PACOD_JOBS_PER_ORGANISATION:
      # The AI gateway (pacod-gw): its address, the studio's key and the model it asks for. The
      # development gateway is pacod-gw in docker-compose.standalone.yml; a deployment names its
      # own. Without a key, AI is not set up. @fast is a pool of the development gateway.
      PACOD_GW_URL: ${PACOD_GW_URL:-http://pacod-gw:8080}
      PACOD_GW_API_KEY: ${PACOD_GW_API_KEY:-}
      PACOD_AI_MODEL: ${PACOD_AI_MODEL:-@fast}
      # See cms-site for why this carries no value.
      CORS_ALLOWED_ORIGINS:
      # Logging, as on cms-site. LOG_DIR is the container's side of the mount below, never the host's.
      SERVICE_NAME: cms-studio
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_LOG_FORMAT: ${APP_LOG_FORMAT:-json}
      LOG_DIR: /data/logs
      # The same storage as cms-site, read-write: the studio is the only writer.
      STORAGE_ROOT: /data/storage
      # How a website's own address is spelled from here: the banner previews are framed from the
      # website's origin, never the studio's, and "view site" links there. The port is Caddy's
      # published HTTP port; blank means the scheme's default.
      # Both passed through without a value: unset stays unset, so the profile decides (dev: http
      # and HTTP_PORT; prod: https and the scheme's default). Set both in production only if readers
      # reach the websites some other way.
      SITE_PUBLIC_SCHEME:
      SITE_PUBLIC_PORT:
      HTTP_PORT: ${HTTP_PORT:-8000}
      # Sign-in through pacod-id: the public issuer for the browser's redirects, the internal
      # listener for everything server-to-server. Not a dependency of this container's health:
      # with pacod-id down the studio's screens answer 503 and /mgmt-health stays up.
      PACOD_ID_ISSUER: ${ID_ISSUER:-http://id.localhost:${HTTP_PORT:-8000}}
      PACOD_ID_INTERNAL_URL: ${PACOD_ID_INTERNAL_URL:-http://pacod-id-internal:8071}
      PACOD_ID_STUDIO_SECRET: ${CMS_ID_STUDIO_SECRET:?run make init}
      PACOD_ID_SERVICE_SECRET: ${CMS_ID_SERVICE_SECRET:?run make init}
      STUDIO_ORIGIN: ${STUDIO_ORIGIN:-http://studio.localhost:${HTTP_PORT:-8000}}
      # The provisioner's pidt_ token (make up writes it into .env, make id-provisioner): how the
      # creator of a new organisation becomes its admin. Empty, only platform admins create
      # organisations. No default worth publishing exists.
      PACOD_ID_PROVISIONER_TOKEN: ${PACOD_ID_PROVISIONER_TOKEN:-}
      # The draft-preview key, the site's too (make init writes it into .env). Empty: no
      # previews. No default: a published one would be a published key.
      PACOD_PREVIEW_SECRET: ${PACOD_PREVIEW_SECRET:-}
      # The portal: every new website answers at <id>.<PACOD_SITE_DOMAIN> first (blank: its
      # creator names an address); PACOD_ORG_CREATION=platform-admins closes self-service whatever
      # the installation screen says. The limits are starting values the screen then owns.
      # A blank value stays blank (no :-): production may leave the address to each website's creator.
      PACOD_SITE_DOMAIN: ${PACOD_SITE_DOMAIN-localhost}
      # true lets the websites share the studio's and pacod-id's registrable domain, which the studio
      # otherwise refuses (StudioDomainCheck): a website's script can then set cookies they receive.
      # Only where every website is trusted, such as pacod-demo on one domain.
      PACOD_SITE_DOMAIN_SHARED: ${PACOD_SITE_DOMAIN_SHARED:-false}
      PACOD_ORG_CREATION: ${PACOD_ORG_CREATION:-self-service}
      PACOD_MAX_ORGS_PER_USER:
      PACOD_MAX_SITES_PER_ORG:
      PACOD_AI_FOR_NEW_ORGS:
      # A fresh platform gets three demo websites -- the journal on editorial and on minimal, the
      # space travels on magazine -- at these hosts, unless DEMO_WEBSITES=false (production);
      # nothing happens once any website exists.
      PACOD_BOOTSTRAP_DEMO_ENABLED: ${DEMO_WEBSITES:-true}
      PACOD_BOOTSTRAP_DEMO_HOSTS: ${DEMO_HOSTS:-demo.localhost,localhost}
      PACOD_BOOTSTRAP_DEMO_MINIMAL_HOSTS: ${DEMO_MINIMAL_HOSTS:-minimal.localhost}
      PACOD_BOOTSTRAP_DEMO_SPACE_HOSTS: ${DEMO_SPACE_HOSTS:-space.localhost}
      # What an article image must be. Set on this service only: it is the one application with
      # an upload endpoint an operator reaches.
      #
      # The two checks switch INDEPENDENTLY -- both, neither, dimensions only, weight only. Each
      # leaves the content-type allow-list and the "is this actually an image" check in force,
      # and the studio's own help text follows both, so the screens never promise a refusal that
      # will not happen. IMAGE_FILE_SIZE_CHECK=false does not mean unlimited: Caddy and the
      # servlet container still refuse above 4MB, and the screens state that ceiling instead.
      IMAGE_REQUIRED_WIDTH: ${IMAGE_REQUIRED_WIDTH:-600}
      IMAGE_REQUIRED_HEIGHT: ${IMAGE_REQUIRED_HEIGHT:-400}
      IMAGE_MAX_BYTES: ${IMAGE_MAX_BYTES:-409600}
      IMAGE_DIMENSION_CHECK: ${IMAGE_DIMENSION_CHECK:-true}
      IMAGE_FILE_SIZE_CHECK: ${IMAGE_FILE_SIZE_CHECK:-true}
    ports:
      - "${PUBLISH_IP:-}:${MGMT_PORT:-7070}:7443"
    volumes:
      - ${LOG_DIR_HOST:-./.data/logs}:/data/logs
      # Read-write, and the one service that needs it: article images and banner creatives are
      # written here, each into its website's own folder, created on first upload.
      - ${STORAGE_HOST:-./.data/storage}:/data/storage
      # - ./config:/app/config:ro   # uncomment to supply a TLS keystore
    networks:
      - pacod-net
      # pacod-id's internal listener is there alone.
      - pacod-admin-net
    healthcheck:
      # /mgmt-health, outside the authenticated /mgmt/** matcher -- a healthcheck that has to log
      # in is not a healthcheck. Liveness only: it cannot tell you pacod-id is unreachable and
      # nobody can sign in (the studio's screens then answer 503, and this container logs why).
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7443/mgmt-health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # ---- PDF export: Gotenberg ------------------------------------------------------------------
  #
  # The studio's PDF jobs render each article's print view here. Its Chromium is the one thing on
  # the stack that fetches what an author wrote -- an article body accepts any markup -- so it may
  # reach the site's internal address and nothing else: not the studio, pacod-id, MongoDB or the
  # internet (the web fonts of the print view simply do not load). No port is published; only the
  # studio talks to it. JavaScript is off: the print view needs none.
  cms-gotenberg:
    image: gotenberg/gotenberg:8.38.1
    container_name: cms-gotenberg
    logging: *logging
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-allow-list=^http://cms-site:8443(/|$$)
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --chromium-disable-javascript
      - --api-disable-download-from
      - --api-timeout=120s
      - --log-level=info
    networks:
      - pacod-net

networks:
  pacod-net:
    # Shared by every pacod repo, so external: compose never creates it. `make network` (run by
    # `make up`) does, idempotently.
    external: true
  # Internal (no route out): the listeners only servers reach, here pacod-id's internal one.
  # Created by `make network` as well.
  pacod-admin-net:
    external: true

volumes:
  # For MONGO_DATA_DIR=cms-mongo-data: a Docker volume rather than a host folder. On macOS a bind
  # mount into the Docker VM intermittently refuses MongoDB's file operations ("Operation not
  # permitted"), which surfaces as an index that silently fails to build.
  cms-mongo-data:
